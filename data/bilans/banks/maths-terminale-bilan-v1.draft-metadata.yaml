# Métadonnées pédagogiques à compléter — Maths Terminale v1
#
# Ce fichier est un formulaire de travail. Les énoncés, domaines et options sont recopiés
# du pack JSON uniquement pour situer les items : NE PAS LES MODIFIER ICI.
#
# nodeCpsId désigne le prérequis structurant précis évalué par l’item. Un item ne doit
# tester qu’un seul prérequis : plusieurs causes possibles rendent le diagnostic ambigu.
# Un distracteur doit correspondre à une erreur réelle observable. Sans cette justification,
# ERREUR_CONFIANTE devient une étiquette décorative et non un signal diagnostique.
# Si une option ne capture aucune erreur réelle, saisir exactement : "A REMPLACER".
#
# Aucun champ review.* n’est présent ni modifié par ce formulaire.

