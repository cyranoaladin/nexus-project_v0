items:
  - id: EMC-MAT-SUI-01
    nodeCpsId: 1re.maths-complementaires.suites.modele-affine-seuil
    type: QCM_SIMPLE
    difficulty: 2
    targetTimeSec: 75
    statement: "Une suite (uₙ) est définie par u₀ = 5 et, pour tout n, uₙ₊₁ = 0,8 uₙ + 3. On admet qu'elle converge. Quelle est sa limite ?"
    options:
      - { key: A, label: "0", correct: false, distractorRationale: "Assimile à tort la limite d'une suite convergente à zéro sans utiliser la relation de récurrence." }
      - { key: B, label: "15", correct: true }
      - { key: C, label: "3", correct: false, distractorRationale: "Retient uniquement le terme ajouté dans la récurrence au lieu de résoudre l'équation vérifiée par la limite." }
      - { key: D, label: "Elle tend vers +∞ car on ajoute 3 à chaque étape", correct: false, distractorRationale: "Ignore le facteur 0,8 qui amortit les termes et empêche une accumulation additive de 3 à chaque étape." }
    shortCorrection: "Si la suite converge vers L, la relation donne L = 0,8L + 3. Ainsi 0,2L = 3, donc L = 15."
    tags: [suites, recurrence, limite]

  - id: EMC-MAT-SUI-02
    nodeCpsId: 1re.maths-complementaires.suites.modele-affine-seuil
    type: QCM_SIMPLE
    difficulty: 2
    targetTimeSec: 90
    statement: "Une population diminue de 12 % par an. Au bout de combien d'années aura-t-elle perdu au moins la moitié de son effectif ?"
    options:
      - { key: A, label: "4 ans", correct: false, distractorRationale: "Sous-estime le nombre d'itérations nécessaires en raisonnant sur une diminution approximativement linéaire." }
      - { key: B, label: "6 ans", correct: true }
      - { key: C, label: "5 ans", correct: false, distractorRationale: "S'arrête une année trop tôt : 0,88⁵ reste supérieur à 0,5." }
      - { key: D, label: "8 ans, car 12 × 8 = 96 % ≈ 100 %", correct: false, distractorRationale: "Additionne les pourcentages annuels au lieu d'appliquer successivement le coefficient multiplicateur 0,88." }
    shortCorrection: "Après n années, la proportion restante vaut 0,88ⁿ. On a 0,88⁵ ≈ 0,528 > 0,5 et 0,88⁶ ≈ 0,464 ≤ 0,5 : le seuil est atteint au bout de 6 ans."
    tags: [suites, pourcentages, seuil]

  - id: EMC-MAT-DER-01
    nodeCpsId: 1re.maths-complementaires.derivation.extremum-tangente
    type: QCM_SIMPLE
    difficulty: 2
    targetTimeSec: 60
    statement: "Soit f définie sur ℝ par f(x) = x³ − 3x. Que peut-on affirmer en x = 0 ?"
    options:
      - { key: A, label: "f admet un maximum local", correct: false, distractorRationale: "Conclut à un maximum sans étudier la dérivée au voisinage de zéro." }
      - { key: B, label: "f admet un minimum local", correct: false, distractorRationale: "Conclut à un minimum sans vérifier que la dérivée s'annule ou change de signe." }
      - { key: C, label: "f n'admet ni maximum ni minimum local en 0", correct: true }
      - { key: D, label: "On ne peut pas conclure sans calculer f″(0)", correct: false, distractorRationale: "Pense que la dérivée seconde est nécessaire alors que f′(0) ≠ 0 suffit à exclure un extremum local." }
    shortCorrection: "f′(x) = 3x² − 3, donc f′(0) = −3 ≠ 0. La fonction est localement décroissante en 0 : elle n'y admet ni maximum ni minimum local."
    tags: [derivation, extremum]

  - id: EMC-MAT-DER-02
    nodeCpsId: 1re.maths-complementaires.derivation.extremum-tangente
    type: QCM_SIMPLE
    difficulty: 1
    targetTimeSec: 45
    statement: "La tangente à la courbe de f au point d'abscisse 2 a pour équation y = −3x + 7. Que vaut f′(2) ?"
    options:
      - { key: A, label: "7", correct: false, distractorRationale: "Confond l'ordonnée à l'origine de la tangente avec son coefficient directeur." }
      - { key: B, label: "1", correct: false, distractorRationale: "Ne relie pas le nombre dérivé au coefficient directeur de la tangente." }
      - { key: C, label: "−3", correct: true }
      - { key: D, label: "−3x + 7", correct: false, distractorRationale: "Donne l'équation entière de la tangente au lieu de sa pente." }
    shortCorrection: "Le nombre dérivé f′(2) est le coefficient directeur de la tangente au point d'abscisse 2. Dans y = −3x + 7, ce coefficient vaut −3."
    tags: [derivation, tangente]

  - id: EMC-MAT-FON-01
    nodeCpsId: 1re.maths-complementaires.fonctions.produit-et-exponentielle
    type: QCM_SIMPLE
    difficulty: 2
    targetTimeSec: 70
    statement: "Soit f(x) = (2x + 1)(x − 3). Quelle est l'expression de f′(x) ?"
    options:
      - { key: A, label: "2", correct: false, distractorRationale: "Ne dérive que le premier facteur et oublie la formule de dérivation d'un produit." }
      - { key: B, label: "4x − 5", correct: true }
      - { key: C, label: "2x − 6", correct: false, distractorRationale: "Dérive seulement une partie de l'expression ou distribue incorrectement les termes." }
      - { key: D, label: "(2)(1) = 2", correct: false, distractorRationale: "Multiplie les dérivées des deux facteurs, comme si (uv)' = u'v'." }
    shortCorrection: "Avec u = 2x + 1 et v = x − 3, (uv)' = u'v + uv' = 2(x − 3) + (2x + 1) = 4x − 5."
    tags: [fonctions, derivation, produit]

  - id: EMC-MAT-FON-02
    nodeCpsId: 1re.maths-complementaires.fonctions.produit-et-exponentielle
    type: QCM_SIMPLE
    difficulty: 1
    targetTimeSec: 45
    statement: "Pour tout réel x, l'expression e²ˣ × e⁻ˣ est égale à :"
    options:
      - { key: A, label: "e⁻²ˣ", correct: false, distractorRationale: "Multiplie ou soustrait incorrectement les exposants." }
      - { key: B, label: "eˣ", correct: true }
      - { key: C, label: "e⁻ˣ", correct: false, distractorRationale: "Conserve seulement le second facteur et oublie la règle eᵃeᵇ = eᵃ⁺ᵇ." }
      - { key: D, label: "2eˣ", correct: false, distractorRationale: "Transforme à tort la somme des exposants en coefficient multiplicatif." }
    shortCorrection: "Pour une même base, on additionne les exposants : e²ˣ × e⁻ˣ = e^(2x−x) = eˣ."
    tags: [fonctions, exponentielle, calcul]

  - id: EMC-MAT-EXP-01
    nodeCpsId: 1re.maths-complementaires.exponentielle.positivite-variations
    type: QCM_SIMPLE
    difficulty: 1
    targetTimeSec: 45
    statement: "L'équation eˣ = −2 admet :"
    options:
      - { key: A, label: "une solution négative", correct: false, distractorRationale: "Pense que l'exponentielle prend des valeurs négatives lorsque x est négatif." }
      - { key: B, label: "deux solutions", correct: false, distractorRationale: "Confond la courbe exponentielle avec une fonction pouvant couper plusieurs fois une droite horizontale négative." }
      - { key: C, label: "aucune solution", correct: true }
      - { key: D, label: "une solution, x = ln(−2)", correct: false, distractorRationale: "Ignore que l'exponentielle est strictement positive et que ln n'est défini que sur les réels strictement positifs." }
    shortCorrection: "Pour tout réel x, eˣ est strictement positif. Il ne peut donc jamais être égal à −2 : l'équation n'a aucune solution réelle."
    tags: [exponentielle, positivite]

  - id: EMC-MAT-EXP-02
    nodeCpsId: 1re.maths-complementaires.exponentielle.positivite-variations
    type: QCM_SIMPLE
    difficulty: 2
    targetTimeSec: 50
    statement: "Soit f(x) = e⁻⁰′⁵ˣ. Que peut-on dire de f sur ℝ ?"
    options:
      - { key: A, label: "Elle est croissante et positive", correct: false, distractorRationale: "Oublie que l'exposant −0,5x rend la fonction décroissante." }
      - { key: B, label: "Elle est décroissante et strictement positive", correct: true }
      - { key: C, label: "Elle est décroissante et devient négative pour x grand", correct: false, distractorRationale: "Sait que la fonction décroît mais ignore la stricte positivité de toute exponentielle." }
      - { key: D, label: "Elle est décroissante et s'annule en +∞", correct: false, distractorRationale: "Confond tendre vers zéro avec atteindre effectivement la valeur zéro." }
    shortCorrection: "La fonction x ↦ e^(−0,5x) est strictement positive sur ℝ. Comme le coefficient de x dans l'exposant est négatif, elle est décroissante."
    tags: [exponentielle, variations]

  - id: EMC-MAT-LOG-01
    nodeCpsId: terminale.maths-complementaires.logarithme.proprietes-inequations
    type: QCM_SIMPLE
    difficulty: 2
    targetTimeSec: 45
    statement: "Pour a > 0 et b > 0, l'expression ln(a) + ln(b) est égale à :"
    options:
      - { key: A, label: "ln(a + b)", correct: false, distractorRationale: "Transfère à tort l'addition des logarithmes à une addition des arguments." }
      - { key: B, label: "ln(ab)", correct: true }
      - { key: C, label: "ln(a) × ln(b)", correct: false, distractorRationale: "Confond l'identité logarithmique avec une multiplication des logarithmes." }
      - { key: D, label: "2 ln(ab)", correct: false, distractorRationale: "Ajoute un facteur 2 sans propriété justificative." }
    shortCorrection: "Pour a > 0 et b > 0, la propriété fondamentale est ln(ab) = ln(a) + ln(b). Cet item est un repère de pont vers une notion introduite en Terminale."
    tags: [logarithme, bridge]

  - id: EMC-MAT-LOG-02
    nodeCpsId: terminale.maths-complementaires.logarithme.proprietes-inequations
    type: QCM_SIMPLE
    difficulty: 2
    targetTimeSec: 60
    statement: "On résout l'inéquation ln(x) ≤ 2. L'ensemble des solutions est :"
    options:
      - { key: A, label: "]−∞ ; e²]", correct: false, distractorRationale: "Oublie la condition de définition x > 0 du logarithme népérien." }
      - { key: B, label: "]0 ; e²]", correct: true }
      - { key: C, label: "[e² ; +∞[", correct: false, distractorRationale: "Inverse le sens de l'inégalité alors que ln est strictement croissante." }
      - { key: D, label: "]0 ; 2]", correct: false, distractorRationale: "Traite ln comme l'identité et remplace à tort ln(x) ≤ 2 par x ≤ 2." }
    shortCorrection: "Le logarithme est défini pour x > 0 et strictement croissant. Ainsi ln(x) ≤ 2 équivaut à 0 < x ≤ e². Item de pont vers la Terminale."
    tags: [logarithme, inequations, bridge]

  - id: EMC-MAT-SDG-01
    nodeCpsId: 1re.maths-complementaires.second-degre.signe-solutions
    type: QCM_SIMPLE
    difficulty: 2
    targetTimeSec: 65
    statement: "Soit f(x) = −2x² + 8x − 6. Quel est le signe de f(x) sur ℝ ?"
    options:
      - { key: A, label: "Positif sur ℝ", correct: false, distractorRationale: "Ne cherche ni les racines ni le signe du coefficient dominant." }
      - { key: B, label: "Négatif sur ℝ", correct: false, distractorRationale: "S'appuie seulement sur le coefficient dominant négatif sans tenir compte des racines." }
      - { key: C, label: "Positif sur ]1 ; 3[, négatif à l'extérieur", correct: true }
      - { key: D, label: "Négatif sur ]1 ; 3[, positif à l'extérieur", correct: false, distractorRationale: "Inverse la règle du signe d'un trinôme de coefficient dominant négatif." }
    shortCorrection: "f(x) = −2(x−1)(x−3). Le coefficient dominant est négatif : le trinôme est positif entre ses racines 1 et 3, et négatif à l'extérieur."
    tags: [second-degre, signe]

  - id: EMC-MAT-SDG-02
    nodeCpsId: 1re.maths-complementaires.second-degre.signe-solutions
    type: QCM_SIMPLE
    difficulty: 1
    targetTimeSec: 50
    statement: "L'équation x² + 4x + 5 = 0 admet :"
    options:
      - { key: A, label: "deux solutions distinctes", correct: false, distractorRationale: "Suppose qu'une équation du second degré possède toujours deux solutions réelles." }
      - { key: B, label: "une solution double", correct: false, distractorRationale: "Conclut à tort que le discriminant est nul." }
      - { key: C, label: "aucune solution réelle", correct: true }
      - { key: D, label: "deux solutions, x = −4 et x = −5", correct: false, distractorRationale: "Lit les coefficients comme des racines sans vérifier l'équation." }
    shortCorrection: "Le discriminant vaut Δ = 4² − 4×1×5 = 16 − 20 = −4 < 0. L'équation n'admet donc aucune solution réelle."
    tags: [second-degre, discriminant]

  - id: EMC-MAT-PRO-01
    nodeCpsId: terminale.maths-complementaires.probabilites.independance-bayes
    type: QCM_SIMPLE
    difficulty: 2
    targetTimeSec: 60
    statement: "A et B sont deux événements avec P(A) = 0,4 et P(B) = 0,5. On sait que P(A ∩ B) = 0,2. A et B sont :"
    options:
      - { key: A, label: "incompatibles", correct: false, distractorRationale: "Confond incompatibilité et indépendance : des événements incompatibles auraient une intersection de probabilité nulle." }
      - { key: B, label: "indépendants", correct: true }
      - { key: C, label: "ni l'un ni l'autre", correct: false, distractorRationale: "Ne vérifie pas l'égalité P(A∩B) = P(A)P(B)." }
      - { key: D, label: "incompatibles et indépendants", correct: false, distractorRationale: "Cumule deux propriétés incompatibles ici puisque P(A∩B)=0,2 et non zéro." }
    shortCorrection: "P(A)P(B) = 0,4×0,5 = 0,2 = P(A∩B). Les événements A et B sont donc indépendants."
    tags: [probabilites, independance]

  - id: EMC-MAT-PRO-02
    nodeCpsId: terminale.maths-complementaires.probabilites.independance-bayes
    type: QCM_SIMPLE
    difficulty: 3
    targetTimeSec: 100
    statement: "Dans une population, 3 % des personnes sont porteuses d'un virus. Un test est positif chez 95 % des porteurs et chez 2 % des non-porteurs. Une personne testée positive est-elle probablement porteuse ?"
    options:
      - { key: A, label: "Oui, à 95 %", correct: false, distractorRationale: "Confond la sensibilité P(test positif | porteur) avec la probabilité recherchée P(porteur | test positif)." }
      - { key: B, label: "Oui, à environ 59 %", correct: true }
      - { key: C, label: "Oui, à environ 97 %", correct: false, distractorRationale: "Additionne ou combine les pourcentages sans tenir compte de la prévalence et des faux positifs." }
      - { key: D, label: "On ne peut pas conclure sans connaître la taille de la population", correct: false, distractorRationale: "Pense qu'un effectif absolu est nécessaire alors que les probabilités et taux fournis suffisent." }
    shortCorrection: "P(porteur|+) = 0,03×0,95 / (0,03×0,95 + 0,97×0,02) ≈ 0,595. La personne positive a donc environ 59 % de probabilité d'être porteuse. Item de pont vers Bayes."
    tags: [probabilites, conditionnement, bayes, bridge]

  - id: EMC-MAT-ESP-01
    nodeCpsId: terminale.maths-complementaires.esperance.binomiale-jeu
    type: QCM_SIMPLE
    difficulty: 1
    targetTimeSec: 45
    statement: "X suit une loi binomiale de paramètres n = 10 et p = 0,3. Que vaut E(X) ?"
    options:
      - { key: A, label: "0,3", correct: false, distractorRationale: "Confond le paramètre p avec l'espérance de la loi binomiale." }
      - { key: B, label: "10", correct: false, distractorRationale: "Confond le nombre d'épreuves n avec l'espérance." }
      - { key: C, label: "3", correct: true }
      - { key: D, label: "2,1", correct: false, distractorRationale: "Calcule np(1−p), expression liée à la variance, au lieu de np." }
    shortCorrection: "Pour X suivant une loi binomiale B(n,p), E(X) = np. Ici E(X) = 10×0,3 = 3. La loi binomiale est un contenu de pont vers la Terminale."
    tags: [probabilites, binomiale, esperance, bridge]

  - id: EMC-MAT-ESP-02
    nodeCpsId: terminale.maths-complementaires.esperance.binomiale-jeu
    type: QCM_SIMPLE
    difficulty: 1
    targetTimeSec: 50
    statement: "Un jeu rapporte 10 € avec probabilité 0,2 et fait perdre 5 € avec probabilité 0,8. Quelle est l'espérance de gain ?"
    options:
      - { key: A, label: "+5 €", correct: false, distractorRationale: "Soustrait les montants 10 et 5 sans les pondérer par leurs probabilités." }
      - { key: B, label: "−2 €", correct: true }
      - { key: C, label: "+2 €", correct: false, distractorRationale: "Ne tient compte que du gain espéré 10×0,2 et oublie la perte pondérée." }
      - { key: D, label: "0 € : les gains et les pertes se compensent", correct: false, distractorRationale: "Suppose une compensation des montants sans considérer les probabilités très différentes." }
    shortCorrection: "L'espérance vaut 10×0,2 + (−5)×0,8 = 2 − 4 = −2 €."
    tags: [probabilites, esperance]

  - id: EMC-MAT-EVO-01
    nodeCpsId: 1re.maths-complementaires.evolutions.taux-successifs
    type: QCM_SIMPLE
    difficulty: 1
    targetTimeSec: 55
    statement: "Un prix augmente de 20 %, puis baisse de 20 %. Par rapport au prix initial, il a :"
    options:
      - { key: A, label: "retrouvé sa valeur initiale", correct: false, distractorRationale: "Additionne +20 % et −20 % au lieu de multiplier les coefficients successifs." }
      - { key: B, label: "baissé de 4 %", correct: true }
      - { key: C, label: "augmenté de 4 %", correct: false, distractorRationale: "Calcule le bon écart absolu mais en inverse le signe." }
      - { key: D, label: "baissé de 40 %", correct: false, distractorRationale: "Additionne les valeurs absolues des deux taux au lieu de composer les évolutions." }
    shortCorrection: "Les coefficients multiplicateurs sont 1,20 puis 0,80. Leur produit vaut 0,96 : le prix final représente 96 % du prix initial, soit une baisse de 4 %."
    tags: [evolutions, pourcentages]

  - id: EMC-MAT-EVO-02
    nodeCpsId: 1re.maths-complementaires.evolutions.taux-successifs
    type: QCM_SIMPLE
    difficulty: 1
    targetTimeSec: 45
    statement: "Une valeur passe de 250 à 300. Quel est le taux d'évolution ?"
    options:
      - { key: A, label: "+50 %", correct: false, distractorRationale: "Confond l'augmentation absolue de 50 avec un taux de 50 %." }
      - { key: B, label: "+20 %", correct: true }
      - { key: C, label: "+16,7 %", correct: false, distractorRationale: "Rapporte l'augmentation 50 à la valeur finale 300 au lieu de la rapporter à la valeur initiale 250." }
      - { key: D, label: "+1,2 %", correct: false, distractorRationale: "Confond le coefficient multiplicateur 1,2 avec un pourcentage de 1,2 %." }
    shortCorrection: "Le taux d'évolution est (300−250)/250 = 50/250 = 0,20, soit +20 %."
    tags: [evolutions, taux]
