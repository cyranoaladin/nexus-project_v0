[pytest]
# Le run par défaut du dépôt ne collecte que `tests/`.
#
# `instruments/EDS-NSI/tests/` n'est pas la suite du dépôt : c'est du matériel de
# passation, remis au candidat avec son sujet et exécuté par le correcteur dans le
# répertoire de travail du candidat, contre le `rendu.py` que celui-ci a écrit. Collecté
# ici, il ne pouvait qu'être ignoré — vingt-deux ignorés à chaque exécution, qui ne
# prouvaient rien et masquaient les ignorés qui, eux, auraient mérité un regard.
#
# Ces vingt-deux tests ne sont ni supprimés ni désactivés : `tests/test_nsi_harnais.py`
# les exécute pour de bon, dans un répertoire temporaire, contre la solution de référence
# puis contre une réponse volontairement fausse, et confronte le résultat au barème du
# référentiel. Il vérifie aussi qu'en l'absence de rendu le harnais ignore au lieu de
# réussir : un correcteur qui se tromperait de répertoire ne peut pas obtenir une note
# pleine par accident.
#
# `testpaths` ne s'applique qu'en l'absence d'argument : `pytest instruments/EDS-NSI/tests`
# reste le chemin de la correction réelle, et c'est celui qu'emploie le harnais.
testpaths = tests
