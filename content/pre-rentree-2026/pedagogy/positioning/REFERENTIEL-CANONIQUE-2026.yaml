    severite: BLOQUANT_PUBLICATION
    description: >
      Des documents d'offre antérieurs mentionnent Physique-Chimie en Seconde,
      mais le référentiel canonique vérifié ne contient ni module
      seconde-physique-chimie ni cinq séances publiées. Aucune CPS ne peut donc
      recevoir de seanceRattachement contractuel pour cette combinaison.
    resolutionAttendue: >
      Décider si la matière est retirée de l'offre Seconde ou créer, valider et
      publier d'abord son module de cinq séances, puis produire sa CPS.

