# TEMPORARY, manual-only diagnostic. Not part of the required CI gate.
#
# Purpose: gather a real in-CI reproduction rate for
# e2e/auth/auth-client-lifecycle.spec.ts:152's "revocation on focus after
# recovering from a network failure" test, which has failed twice on
# unrelated PRs (#274 on firefox-smoke, #276 on webkit-smoke) with an
# identical signature (toHaveURL(/\/auth\/signin/) timing out at 5000ms)
# but reproduced 0/13 times locally under a matching environment. Runs the
# one suspect test --repeat-each=15 on firefox-smoke and webkit-smoke
# against the real CI stack, to see whether CI-runner-specific timing
# actually reproduces it. Delete this file once the investigation closes.
name: Diagnose auth-client-lifecycle flake

on:
  workflow_dispatch: {}
  # workflow_dispatch alone can't be discovered/dispatched by the API until
  # the workflow file exists on the default branch, which this temporary
  # diagnostic deliberately never will. Trigger it the same way any normal
  # commit triggers CI: a push to this exact throwaway branch.
  push:
    branches: [diagnose/auth-flake-in-ci]

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.1'
  NPM_VERSION: '10.9.8'

jobs:
  repeat-suspect-test:
    name: Repeat suspect test x15 (firefox+webkit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_DISPOSABLE_STACK: '1'
    services:
      postgres-e2e:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis-e2e:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.30.6
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget -qO- http://localhost:8025/api/v1/info || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Prepare isolated NPC storage
        shell: bash
        run: |
          set -Eeuo pipefail
          npc_storage_root="$RUNNER_TEMP/npc-storage"
          install -d -m 0700 -- "$npc_storage_root"
          canonical_storage_root="$(realpath -- "$npc_storage_root")"
          canonical_workspace="$(realpath -- "$GITHUB_WORKSPACE")"
          case "$canonical_storage_root/" in
            "$canonical_workspace/"*)
              echo 'NPC storage must remain outside the checked-out release.' >&2
              exit 1
              ;;
          esac
          printf 'NPC_STORAGE_ROOT=%s\n' "$canonical_storage_root" >> "$GITHUB_ENV"

      - name: Prepare isolated document storage
        shell: bash
        run: |
          set -Eeuo pipefail
          document_storage_root="$RUNNER_TEMP/document-storage"
          install -d -m 0700 -- "$document_storage_root"
          canonical_storage_root="$(realpath -- "$document_storage_root")"
          canonical_workspace="$(realpath -- "$GITHUB_WORKSPACE")"
          case "$canonical_storage_root/" in
            "$canonical_workspace/"*)
              echo 'Document storage must remain outside the checked-out release.' >&2
              exit 1
              ;;
          esac
          printf 'DOCUMENT_STORAGE_ROOT=%s\n' "$canonical_storage_root" >> "$GITHUB_ENV"

      - name: Prepare ARIA RAG E2E fixture manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          cp -- \
            "$GITHUB_WORKSPACE/data/aria/testing/rag/a09b2844efff34329770358bf9d93a34a1d2194204a1e1396ad552b0195be4e8.json" \
            "$GITHUB_WORKSPACE/data/aria/testing/rag/a09b2844efff34329770358bf9d93a34a1d2194204a1e1396ad552b0195be4e8.aria-rag-manifest"

      - name: Wait for Postgres (E2E) to be ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5433 -U postgres; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres... ($i/30)"
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Generate Prisma Client
        run: |
          npx prisma generate
          npx prisma generate --schema=core-v2/prisma/schema.prisma

      - name: Seed E2E test data
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/nexus_e2e
        run: |
          npx prisma db execute --schema=prisma/schema.prisma --stdin <<SQL
          DROP SCHEMA IF EXISTS public CASCADE;
          CREATE SCHEMA public;
          SQL
          npx prisma migrate deploy
          npx tsx scripts/seed-e2e-db.ts

      - name: Install Playwright browsers (Firefox + WebKit)
        run: npx playwright install --with-deps firefox webkit

      - name: Build Next.js for E2E
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/nexus_e2e
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-min-32-chars-long-for-ci-environment' }}
          AUTH_TRUST_HOST: 'true'
          OPENAI_API_KEY: sk-test-mock-key-for-ci-build-only
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build:e2e

      - name: Start Next.js server in background (worker bilan actif)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/nexus_e2e
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-min-32-chars-long-for-ci-environment' }}
          AUTH_TRUST_HOST: 'true'
          OPENAI_API_KEY: sk-test-mock-key-for-ci-build-only
          NODE_ENV: production
          RATE_LIMIT_DISABLE: '1'
          RATE_LIMIT_BACKEND: redis
          REDIS_URL: redis://localhost:6380
          RATE_LIMIT_KEY_SECRET: ci-e2e-rate-limit-key-secret-placeholder-32chars
          RATE_LIMIT_KEY_NAMESPACE: nexus-ci-e2e-auth-diag
          RATE_LIMIT_TRUST_PROXY_HOPS: '1'
          EMAIL_OUTBOX_WORKER_ENABLED: 'true'
          EMAIL_OUTBOX_ENCRYPTION_KEY: ci-e2e-outbox-encryption-key-0123456789
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: '1025'
          SMTP_FROM: ci-e2e-auth-diag@example.test
          BILAN_WORKER_ENABLED: 'true'
          NEXUS_BILAN_PACK_ENTREE_SECONDE_MATHS_V1_ENABLED: 'true'
          ARIA_TURN_RECOVERY_WORKER_ENABLED: 'true'
          ARIA_TURN_RECOVERY_POLL_INTERVAL_MS: '1000'
          NEXUS_INTERNAL_TOKEN_SECRET: change_ci_e2e_auth_rag_identity_secret_do_not_use_in_prod
          ARIA_RAG_SERVABLE_MANIFEST_ROOT: ${{ github.workspace }}/data/aria/testing/rag
          ARIA_RAG_ACTIVE_MANIFEST_SHA256: a09b2844efff34329770358bf9d93a34a1d2194204a1e1396ad552b0195be4e8
          ARIA_E2E_RAG_CANDIDAT: scolarise
          ARIA_E2E_RAG_AUDIENCE: aefe
          ARIA_E2E_RAG_ZONE: aefe
          ARIA_E2E_RAG_STATUS_DETAIL: aefe
        run: |
          cp -r .next/static .next/standalone/.next/static 2>/dev/null || true
          cp -r public .next/standalone/public 2>/dev/null || true
          node .next/standalone/server.js &
          echo $! > .next-server.pid
          for i in {1..30}; do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Server + Health API ready"
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
          echo "Server failed to start (health endpoint not responding)"
          curl -v http://localhost:3000/api/health 2>&1 || true
          exit 1

      - name: Alias redis-e2e vers le service Redis jetable
        run: echo "127.0.0.1 redis-e2e" | sudo tee -a /etc/hosts

      - name: Repeat the suspect test x15 on firefox-smoke and webkit-smoke, no retries
        timeout-minutes: 25
        env:
          AUTH_E2E_REPORT_LABEL: auth-flake-diagnostic
          BASE_URL: http://localhost:3000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/nexus_e2e
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-min-32-chars-long-for-ci-environment' }}
          AUTH_TRUST_HOST: 'true'
          MAILPIT_API_URL: http://localhost:8025
          E2E_DISPOSABLE_REDIS_URL: redis://redis-e2e:6380/0
          NEXUS_BILAN_PACK_ENTREE_SECONDE_MATHS_V1_ENABLED: 'true'
          PWTEST_SKIP_TEST_OUTPUT: '0'
        run: |
          npx playwright test --config=playwright.auth.config.ts \
            --project=firefox-smoke --project=webkit-smoke \
            -g "the real session provider still observes revocation on focus after recovering from a network failure" \
            --repeat-each=15 --retries=0 --trace=on

      - name: Upload diagnostic report + traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auth-flake-diagnostic-${{ github.sha }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
