name: Preview Artifact

on:
  workflow_dispatch:
    inputs:
      preview_video_mode:
        description: Explicit Preview video mode (DISABLED or JITSI)
        required: true
        type: string
      preview_jitsi_server_url:
        description: Authorized HTTPS Jitsi URL; required only for JITSI and forbidden for DISABLED
        required: false
        type: string

permissions:
  contents: read
  checks: read
  actions: read
  pull-requests: read

concurrency:
  group: preview-artifact-${{ github.sha }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.23.1'
  NPM_VERSION: '10.9.8'

jobs:
  build-preview-artifact:
    name: Build isolated Preview artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: nexus_prod
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout workflow definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate dispatch source, workflow ref, and video configuration
        env:
          APPLICATION_SOURCE_SHA: ${{ github.sha }}
          REQUESTED_VIDEO_MODE: ${{ inputs.preview_video_mode }}
          REQUESTED_JITSI_URL: ${{ inputs.preview_jitsi_server_url }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_EVENT_NAME: ${{ github.event_name }}
          BUILDER_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          const require = createRequire(import.meta.url);
          const guards = require('./scripts/release/preview-artifact-builder-guards.js');
          const sourceErrors = guards.validateSourceSelection({
            eventName: process.env.WORKFLOW_EVENT_NAME,
            ref: process.env.WORKFLOW_REF,
            workflowSha: process.env.BUILDER_WORKFLOW_SHA,
          });
          const videoErrors = guards.validateVideoDispatch(process.env.REQUESTED_VIDEO_MODE, process.env.REQUESTED_JITSI_URL);
          if (sourceErrors.length || videoErrors.length) throw new Error([...sourceErrors, ...videoErrors].join(','));
          console.log(`APPLICATION_SOURCE_SHA=${process.env.APPLICATION_SOURCE_SHA}`);
          console.log(`BUILDER_WORKFLOW_SHA=${process.env.BUILDER_WORKFLOW_SHA}`);
          console.log('DISPATCH_SOURCE_VALID=YES');
          console.log(`VIDEO_MODE=${process.env.REQUESTED_VIDEO_MODE}`);
          console.log('VIDEO_DISPATCH_CONFIGURATION_VALID=YES');
          NODE

      - name: Verify source SHA checks are all successful
        env:
          GH_TOKEN: ${{ github.token }}
          APPLICATION_SOURCE_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          node scripts/release/preview-artifact-builder-guards.js

      - name: Checkout exact application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: app
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Deliberately no setup-node cache: this one-off builder must not share a branch cache.

      - name: Pin repository npm version
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install locked dependencies
        working-directory: app
        run: npm ci

      - name: Create ephemeral build-only secrets
        shell: bash
        env:
          REQUESTED_VIDEO_MODE: ${{ inputs.preview_video_mode }}
        run: |
          set -Eeuo pipefail
          for key in NEXTAUTH_SECRET RATE_LIMIT_KEY_SECRET EMAIL_OUTBOX_ENCRYPTION_KEY; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done
          if [ "$REQUESTED_VIDEO_MODE" = JITSI ]; then
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            printf '%s=%s\n' JITSI_ROOM_SECRET "$value" >> "$GITHUB_ENV"
          fi

      - name: Generate Prisma clients
        working-directory: app
        run: |
          npx prisma generate
          npx prisma generate --schema=core-v2/prisma/schema.prisma

      - name: Apply migrations to disposable build database
        working-directory: app
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/nexus_prod
        run: npx prisma migrate deploy

      - name: Build and run canonical artifact gates
        working-directory: app
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/nexus_prod
          NEXTAUTH_URL: http://localhost:3211
          NEXT_PUBLIC_APP_URL: http://localhost:3211
          NEXT_PUBLIC_WHATSAPP_NUMBER: '21699192829'
          NEXT_PUBLIC_EAF_DEEP_LINK_BASE_URL: https://eaf.nexusreussite.academy
          NEXT_PUBLIC_ENABLE_CLICTOPAY_PUBLIC: 'false'
          NEXT_PUBLIC_VIDEO_MODE: ${{ inputs.preview_video_mode }}
          NEXT_PUBLIC_JITSI_SERVER_URL: ${{ inputs.preview_jitsi_server_url }}
          RELEASE_SHA: ${{ github.sha }}
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Audit forbidden artifacts and runtime test configuration
        working-directory: app
        run: |
          set -Eeuo pipefail
          npm run artifact:traces
          npm run artifact:audit
          npm run security:forbidden-artifacts:artifact

      - name: Prepare isolated runtime storage
        shell: bash
        run: |
          set -Eeuo pipefail
          bash "$GITHUB_WORKSPACE/app/scripts/release/prepare-preview-smoke-storage.sh"

      - name: Prove standalone rejects missing NPC root
        working-directory: app/.next/standalone
        env:
          CORE_V2_AUTH_MODE: V1_ONLY
          DATABASE_URL: postgresql://postgres@localhost:5432/nexus_prod
          NEXTAUTH_URL: http://localhost:3211
          NEXT_PUBLIC_APP_URL: http://localhost:3211
          HOSTNAME: localhost
          PORT: '3211'
          NODE_ENV: production
          RATE_LIMIT_BACKEND: redis
          REDIS_URL: redis://localhost:6379
          RATE_LIMIT_KEY_NAMESPACE: preview-artifact
          RATE_LIMIT_TRUST_PROXY_HOPS: '1'
          NEXT_PUBLIC_VIDEO_MODE: ${{ inputs.preview_video_mode }}
          NEXT_PUBLIC_JITSI_SERVER_URL: ${{ inputs.preview_jitsi_server_url }}
          NEXUS_ORGANIZATION_TIMEZONE: Africa/Tunis
          EMAIL_OUTBOX_WORKER_ENABLED: 'true'
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: '1025'
          SMTP_FROM: preview-artifact@example.invalid
          ARIA_TURN_RECOVERY_WORKER_ENABLED: 'true'
          ARIA_TURN_RECOVERY_POLL_INTERVAL_MS: '1000'
        run: |
          set -Eeuo pipefail
          bash "$GITHUB_WORKSPACE/app/scripts/release/verify-preview-npc-startup-guard.sh" \
            "$RUNNER_TEMP/preview-delivery-proofs/npc-missing-root.log"

      - name: Smoke the built standalone server
        working-directory: app/.next/standalone
        env:
          CORE_V2_AUTH_MODE: V1_ONLY
          DATABASE_URL: postgresql://postgres@localhost:5432/nexus_prod
          NEXTAUTH_URL: http://localhost:3211
          NEXT_PUBLIC_APP_URL: http://localhost:3211
          HOSTNAME: localhost
          PORT: '3211'
          NODE_ENV: production
          RATE_LIMIT_BACKEND: redis
          REDIS_URL: redis://localhost:6379
          RATE_LIMIT_KEY_NAMESPACE: preview-artifact
          RATE_LIMIT_TRUST_PROXY_HOPS: '1'
          NEXT_PUBLIC_VIDEO_MODE: ${{ inputs.preview_video_mode }}
          NEXT_PUBLIC_JITSI_SERVER_URL: ${{ inputs.preview_jitsi_server_url }}
          REQUESTED_VIDEO_MODE: ${{ inputs.preview_video_mode }}
          REQUESTED_JITSI_URL: ${{ inputs.preview_jitsi_server_url }}
          PREVIEW_SMOKE_ORIGIN: http://localhost:3211
          NEXUS_ORGANIZATION_TIMEZONE: Africa/Tunis
          EMAIL_OUTBOX_WORKER_ENABLED: 'true'
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: '1025'
          SMTP_FROM: preview-artifact@example.invalid
          ARIA_TURN_RECOVERY_WORKER_ENABLED: 'true'
          ARIA_TURN_RECOVERY_POLL_INTERVAL_MS: '1000'
        run: |
          set -Eeuo pipefail
          if [ -n "$(ss -H -ltn '( sport = :3211 )')" ]; then
            echo 'STANDALONE_PORT_ALREADY_OCCUPIED' >&2
            exit 1
          fi
          node server.js >"$RUNNER_TEMP/preview-delivery-proofs/standalone-positive.log" 2>&1 &
          server_pid=$!
          cleanup_server() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            echo 'SMOKE_PROCESS_CLEANUP=PASS'
          }
          trap cleanup_server EXIT
          healthy=0
          for _ in $(seq 1 30); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'STANDALONE_PROCESS_EXITED_BEFORE_READY' >&2
              exit 1
            fi
            if health_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 3 http://localhost:3211/api/health)" && [ "$health_status" = 200 ]; then
              listener_details="$(ss -H -ltnp '( sport = :3211 )')"
              if [[ "$listener_details" != *"pid=$server_pid,"* ]]; then
                echo 'STANDALONE_HEALTH_LISTENER_NOT_OWNED_BY_SERVER' >&2
                exit 1
              fi
              echo 'STANDALONE_HEALTH=PASS'
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "$healthy" != 1 ]; then
            echo 'STANDALONE_HEALTH=FAIL' >&2
            exit 1
          fi
          if grep -Fq 'NPC_STORAGE_PREFLIGHT_FAILED' "$RUNNER_TEMP/preview-delivery-proofs/standalone-positive.log"; then
            echo 'STANDALONE_NPC_STORAGE_PREFLIGHT_FAILED' >&2
            exit 1
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('release-manifest.json', 'utf8'));
          const buildId = fs.readFileSync('.next/BUILD_ID', 'utf8').trim();
          if (manifest.RELEASE_SHA !== process.env.GITHUB_SHA || manifest.BUILD_ID !== buildId ||
              manifest.VIDEO_MODE !== process.env.NEXT_PUBLIC_VIDEO_MODE) {
            throw new Error('STANDALONE_IDENTITY_OR_VIDEO_MODE_MISMATCH');
          }
          console.log('STANDALONE_RELEASE_AND_VIDEO_IDENTITY=PASS');
          NODE
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          const require = createRequire(import.meta.url);
          const { validateVideoCspHeader, validateVideoPermissionsPolicyHeader } = require('../../scripts/release/preview-artifact-builder-guards.js');
          const response = await fetch('http://localhost:3211/');
          if (response.status >= 500) throw new Error(`STANDALONE_PUBLIC_PAGE_HTTP_${response.status}`);
          const errors = [
            ...validateVideoCspHeader(response.headers.get('content-security-policy'), process.env.REQUESTED_VIDEO_MODE, process.env.REQUESTED_JITSI_URL),
            ...validateVideoPermissionsPolicyHeader(response.headers.get('permissions-policy'), process.env.REQUESTED_VIDEO_MODE, process.env.REQUESTED_JITSI_URL),
          ];
          if (errors.length) throw new Error(errors.join(','));
          console.log('STANDALONE_VIDEO_SECURITY_HEADERS=PASS');
          NODE
          (cd ../.. && node scripts/release/verify-preview-client-config.mjs)

      - name: Remove only disposable smoke storage
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -z "${PREVIEW_SMOKE_STORAGE_PARENT:-}" ]; then exit 0; fi
          test ! -L "$PREVIEW_SMOKE_STORAGE_PARENT"
          test -d "$PREVIEW_SMOKE_STORAGE_PARENT"
          storage_parent="$(realpath -e -- "$PREVIEW_SMOKE_STORAGE_PARENT")"
          runner_temp="$(realpath -e -- "$RUNNER_TEMP")"
          if [ "$(dirname -- "$storage_parent")" != "$runner_temp" ] ||
             [[ "$(basename -- "$storage_parent")" != preview-storage-smoke.[A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9] ]]; then
            echo 'SMOKE_STORAGE_CLEANUP_TARGET_INVALID' >&2
            exit 1
          fi
          test "$(stat -c %u -- "$storage_parent")" = "$(id -u)"
          rm -r -- "$storage_parent"
          echo 'SMOKE_STORAGE_CLEANUP=PASS'

      - name: Create deployable archive and provenance sidecar
        working-directory: app
        env:
          APPLICATION_SOURCE_SHA: ${{ github.sha }}
          BUILDER_WORKFLOW_SHA: ${{ github.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
          NEXT_PUBLIC_VIDEO_MODE: ${{ inputs.preview_video_mode }}
          NEXT_PUBLIC_JITSI_SERVER_URL: ${{ inputs.preview_jitsi_server_url }}
        run: |
          set -Eeuo pipefail
          build_id="$(cat .next/BUILD_ID)"
          manifest_sha="$(node -p "JSON.parse(require('fs').readFileSync('.next/standalone/release-manifest.json','utf8')).RELEASE_SHA")"
          test "$manifest_sha" = "$APPLICATION_SOURCE_SHA"
          node --input-type=module - "$build_id" <<'NODE'
          import fs from 'node:fs';
          const expected = process.argv[2];
          const manifest = JSON.parse(fs.readFileSync('.next/standalone/release-manifest.json', 'utf8'));
          if (manifest.BUILD_ID !== expected || manifest.ARTIFACT_VERIFIED !== true) throw new Error('RELEASE_MANIFEST_IDENTITY_INVALID');
          if (manifest.RELEASE_SHA !== process.env.APPLICATION_SOURCE_SHA) throw new Error('RELEASE_MANIFEST_SOURCE_MISMATCH');
          if (manifest.VIDEO_MODE !== process.env.NEXT_PUBLIC_VIDEO_MODE) throw new Error('RELEASE_MANIFEST_VIDEO_MODE_MISMATCH');
          if (manifest.VIDEO_MODE === 'JITSI' && manifest.JITSI_ORIGIN !== new URL(process.env.NEXT_PUBLIC_JITSI_SERVER_URL).origin) {
            throw new Error('RELEASE_MANIFEST_JITSI_ORIGIN_MISMATCH');
          }
          NODE
          test -f .next/standalone/server.js
          test -f .next/standalone/.next/BUILD_ID
          test -d .next/standalone/.next/static
          test -d .next/standalone/public
          if find .next/standalone -type f \( -name '.env' -o -name '.env.local' -o -name 'auth.json' -o -name 'preview-runtime.env' \) -print -quit | grep -q .; then
            echo 'FORBIDDEN_RUNTIME_CONFIG_IN_STANDALONE' >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/preview-delivery"
          cp .next/standalone/release-manifest.json "$RUNNER_TEMP/preview-delivery/release-manifest.json"
          node - "$build_id" > "$RUNNER_TEMP/preview-delivery/delivery-provenance.json" <<'NODE'
          const fs = require('node:fs');
          const [buildId] = process.argv.slice(2);
          const value = {
            APPLICATION_SOURCE_SHA: process.env.APPLICATION_SOURCE_SHA,
            BUILDER_WORKFLOW_SHA: process.env.BUILDER_WORKFLOW_SHA,
            RUN_ID: process.env.BUILD_RUN_ID,
            RUN_ATTEMPT: process.env.BUILD_RUN_ATTEMPT,
            BUILD_ID: buildId,
            RELEASE_MANIFEST_SHA256: require('node:crypto').createHash('sha256').update(fs.readFileSync('.next/standalone/release-manifest.json')).digest('hex'),
            BUILD_CONFIGURATION: {
              NEXTAUTH_URL: 'http://localhost:3211',
              NEXT_PUBLIC_APP_URL: 'http://localhost:3211',
              NEXT_PUBLIC_WHATSAPP_NUMBER: '21699192829',
              NEXT_PUBLIC_EAF_DEEP_LINK_BASE_URL: 'https://eaf.nexusreussite.academy',
              NEXT_PUBLIC_ENABLE_CLICTOPAY_PUBLIC: false,
              NEXT_PUBLIC_VIDEO_MODE: process.env.NEXT_PUBLIC_VIDEO_MODE,
              ...(process.env.NEXT_PUBLIC_VIDEO_MODE === 'JITSI'
                ? { NEXT_PUBLIC_JITSI_SERVER_URL: process.env.NEXT_PUBLIC_JITSI_SERVER_URL }
                : {}),
            },
          };
          process.stdout.write(`${JSON.stringify(value, null, 2)}\n`);
          NODE
          tar --sort=name --owner=0 --group=0 --numeric-owner -czf "$RUNNER_TEMP/preview-delivery/preview-standalone.tar.gz" -C .next/standalone .
          node scripts/release/verify-preview-archive.js "$RUNNER_TEMP/preview-delivery/preview-standalone.tar.gz" .next/standalone
          tar -tzf "$RUNNER_TEMP/preview-delivery/preview-standalone.tar.gz" > "$RUNNER_TEMP/preview-delivery-proofs/archive-entries.txt"
          if grep -Fq "$(basename "$PREVIEW_SMOKE_STORAGE_PARENT")" "$RUNNER_TEMP/preview-delivery-proofs/archive-entries.txt"; then
            echo 'RUNTIME_STORAGE_EMBEDDED_IN_ARCHIVE' >&2
            exit 1
          fi
          echo 'RUNTIME_STORAGE_EXCLUDED_FROM_ARCHIVE=PASS'
          sha256sum "$RUNNER_TEMP/preview-delivery/preview-standalone.tar.gz" > "$RUNNER_TEMP/preview-delivery/preview-standalone.tar.gz.sha256"
          echo "BUILD_ID=$build_id" >> "$GITHUB_STEP_SUMMARY"
          echo "APPLICATION_SOURCE_SHA=$APPLICATION_SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "BUILDER_WORKFLOW_SHA=$BUILDER_WORKFLOW_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "RUN_ID=$BUILD_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "RUN_ATTEMPT=$BUILD_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/preview-delivery/delivery-provenance.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployable Preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-standalone-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-delivery/
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload standalone smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-smoke-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-delivery-proofs/
          retention-days: 14
          if-no-files-found: ignore
