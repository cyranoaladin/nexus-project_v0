# =============================================================================
# CI Pipeline - Nexus Reussite
# =============================================================================
#
# Pipeline with independent dependency, quality, test, security, build, and
# document evidence. All jobs must pass for merge into main.
#
# Triggers:
# - Pull requests vers main or the frozen PR #79 release branch
# - Push sur main (pour verifier apres merge)
#
# Jobs:
# 0. dependency-integrity - npm ci + tree validation + audit
# 1. lint                 - ESLint check
# 2. typecheck            - TypeScript validation
# 3. unit                 - Tests unitaires (jsdom, pas de DB)
# 4. integration          - Tests integration (node + PostgreSQL)
# 5. real-db-integration  - 3 suites / 10 tests PostgreSQL non-Bilan
# 6. e2e                  - Tests E2E (Playwright + app demarree + DB E2E)
# 7. security             - semgrep + OSV scanner
# 8. build                - Next.js production build + artifact audit
# 9. documents            - Verification des 7 PDF publics figes
#
# =============================================================================

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - release/pre-rentree-2026-public-ready

# Least-privilege default for every job's GITHUB_TOKEN -- nothing in this
# workflow comments on PRs, pushes commits/tags, or calls the GitHub API
# with GITHUB_TOKEN, only checkout + build + test + upload-artifact, all
# of which only need read access to repo contents.
permissions:
  contents: read

# Cancel in-progress runs when new commits pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.23.1'
  NPM_VERSION: '10.9.8'
  # CI optimizations
  CI: true
  FORCE_COLOR: 1

jobs:
  # ===========================================================================
  # JOB 0: DEPENDENCY INTEGRITY
  # ===========================================================================
  dependency-integrity:
    name: Dependency Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm version
        run: |
          npm install -g npm@${{ env.NPM_VERSION }}
          node --version
          npm --version
          test "$(node --version)" = "v${{ env.NODE_VERSION }}"
          test "$(npm --version)" = "${{ env.NPM_VERSION }}"

      - name: Install dependencies
        run: npm ci

      - name: Validate npm tree
        run: |
          npm ls --all --json --long > /tmp/npm-tree.json
          node scripts/validate-npm-tree.js \
            --tree /tmp/npm-tree.json \
            --exceptions security/npm-tree-exceptions.json

      - name: Generate SBOM
        run: npm run sbom:runtime

      - name: Forbidden pedagogical artifacts (source tree)
        # Empêche la réintroduction d'un artefact dont la diffusion n'est pas
        # autorisée. La comparaison porte sur l'empreinte du contenu : renommer
        # le fichier ne contourne pas le contrôle.
        # Ce contrôle porte sur les SOURCES ; l'artefact de production est
        # scanné séparément après le build (job build), car du contenu peut y
        # être copié ou reconstruit sans exister tel quel dans les sources.
        run: npm run security:forbidden-artifacts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --json > npm-audit-production.json

      - name: Audit all dependencies without exceptions
        run: npm audit --audit-level=high --json > npm-audit-full.json

      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-integrity-evidence
          path: |
            npm-audit-production.json
            npm-audit-full.json
            security/sbom/runtime.cdx.json
          retention-days: 30
          if-no-files-found: error

  # ===========================================================================
  # JOB 1: LINT
  # ===========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Security repo scan
        run: npm run security:repo

      - name: Enforce canonical zero test debt
        run: npm run test:zero-debt

      # Garde présente dans le dépôt mais qui n'était appelée nulle part : une
      # valeur canonique (adresse, téléphone, matricule, tarif) réintroduite en
      # dur passait donc inaperçue. Elle barre désormais la fusion.
      - name: Reject hardcoded canonical values
        run: npm run check:no-hardcoded

      - name: Run ESLint
        run: npm run lint

      - name: Check docs archive placement
        run: npm run check:docs-archive

      - name: Audit GitHub governance-as-code (offline, no API calls)
        run: npm run governance:audit

      - name: Test GitHub governance-as-code suite
        run: npm run test:governance

  # ===========================================================================
  # JOB 2: TYPECHECK
  # ===========================================================================
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check TypeScript errors with threshold
        run: node .github/scripts/check-typescript-errors.js 0

  # ===========================================================================
  # JOB 3: UNIT TESTS
  # ===========================================================================
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Install PDF tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils texlive-latex-base texlive-latex-recommended
          pdflatex --version
          pdfinfo -v
          pdftotext -v
          pdfimages -v

      # __tests__/bilans/render-pdf.test.ts, group-plan-render.test.ts,
      # pdf-renderer-session.test.ts and rendered-examples.test.ts drive a
      # real headless Chromium via lib/bilans/render/pdf.ts
      # (createBilanPdfRendererSession) for byte-stable HTML-to-PDF export
      # coverage -- there is no mock path. Without this, resolveChromiumExecutable
      # throws ENOENT scanning ~/.cache/ms-playwright and the whole suite fails
      # to even boot (beforeAll throws before any test body runs).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run unit tests
        run: npm test -- --ci --coverage --maxWorkers=2
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_test
          NEXTAUTH_SECRET: test-secret-min-32-chars-long-for-ci-environment
          NEXTAUTH_URL: http://localhost:3000

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 7

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-logs
          path: |
            *.log
            npm-debug.log*
          retention-days: 7
          if-no-files-found: ignore

  # ===========================================================================
  # JOB 4: INTEGRATION TESTS (with PostgreSQL)
  # ===========================================================================
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXUS_DISPOSABLE_POSTGRES: '1'

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_disposable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # State-sensitive lifecycle suites keep separate disposable databases so
      # their cleanup and concurrency fixtures cannot affect another lane.
      # Every URL is still checked by the shared fail-closed database guard.
      mailpit:
        image: axllent/mailpit:v1.30.6
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget -qO- http://localhost:8025/api/v1/info || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      # The MCO paper-entry real-DB test validates the stored HTML and the
      # canonical PDF for all three audiences. The renderer is deliberately
      # soft-fail when Chromium is absent, so this job must provision the
      # package-pinned browser before running that integration contract.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for Postgres to be ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres... ($i/30)"
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Create .env.test for test database
        run: |
          echo 'DATABASE_URL="postgresql://postgres:postgres@localhost:5432/nexus_disposable_test?schema=public"' > .env.test
          echo 'TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/nexus_disposable_test?schema=public"' >> .env.test
          echo 'NODE_ENV="test"' >> .env.test
          printf '%s=%s\n' 'NEXTAUTH_SECRET' 'test-secret-min-32-chars-long-for-ci-environment' >> .env.test
          echo 'NEXTAUTH_URL="http://localhost:3000"' >> .env.test

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_disposable_test
        run: npx prisma generate

      - name: Reset database before migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_disposable_test
        run: |
          npx prisma db execute --schema=prisma/schema.prisma --stdin <<SQL
          DROP SCHEMA IF EXISTS public CASCADE;
          CREATE SCHEMA public;
          SQL

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_disposable_test
        run: npx prisma migrate deploy

      - name: Verify database tables
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_disposable_test
        run: |
          npx prisma db execute --schema=prisma/schema.prisma --stdin <<SQL
          SELECT table_name FROM information_schema.tables
          WHERE table_schema = 'public' AND table_type = 'BASE TABLE'
          ORDER BY table_name;
          SQL

      - name: Create and migrate the isolated per-suite test databases
        env:
          PGPASSWORD: postgres
        run: |
          # A fresh service container for this job run -- these databases
          # cannot already exist, so a plain CREATE DATABASE is enough (no
          # IF NOT EXISTS dance needed, and prisma db execute doesn't
          # support psql meta-commands like \gexec anyway).
          for db in nexus_disposable_s1_session_test nexus_disposable_s2_pending_test nexus_disposable_p0d_parent_test; do
            psql -h localhost -U postgres -d postgres -c "CREATE DATABASE $db;"
          done
          for db in nexus_disposable_s1_session_test nexus_disposable_s2_pending_test nexus_disposable_p0d_parent_test; do
            DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$db" npx prisma db execute --schema=prisma/schema.prisma --stdin <<SQL
          DROP SCHEMA IF EXISTS public CASCADE;
          CREATE SCHEMA public;
          SQL
            DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$db" npx prisma migrate deploy
          done

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_disposable_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_disposable_test?schema=public
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-min-32-chars-long-for-ci-environment' }}
          NODE_ENV: test
        run: >-
          npx jest --config jest.integration.config.js --runInBand --ci
          --testPathIgnorePatterns='/__tests__/lib/bilan-runtime/'
          --testPathIgnorePatterns='session-revocation\.real\.test\.ts'
          --testPathIgnorePatterns='pending-account-lifecycle\.real\.test\.ts'
          --testPathIgnorePatterns='activation-domain-separation\.real\.test\.ts'
          --testPathIgnorePatterns='parent-registration-atomicity\.real\.test\.ts'
          --testPathIgnorePatterns='parent-email-onboarding\.real\.test\.ts'
          --testPathIgnorePatterns='npc-.*\.real\.test\.ts'

      # NPC real-database suites deliberately require UID 0 and their own
      # PostgreSQL 15 runtime. Keep them in the required Integration job, but
      # execute them through the fail-closed disposable harness that supplies
      # those constraints and tears down every resource.
      - name: Run NPC real database integration tests
        env:
          NPC_LLM_MODE: 'off'
        run: |
          bash scripts/testing/run-npc-real-db-tests.sh \
            __tests__/integration/npc-submission-lock.real.test.ts \
            __tests__/integration/npc-tombstone-command.real.test.ts \
            __tests__/integration/npc-worker-integrity.real.test.ts

      - name: Run integration tests (session-revocation -- isolated database)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_disposable_s1_session_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_disposable_s1_session_test?schema=public
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-min-32-chars-long-for-ci-environment' }}
          NODE_ENV: test
        run: >-
          npx jest --config jest.integration.config.js --runInBand --ci
          --testPathPattern='session-revocation\.real\.test\.ts'

      - name: Run integration tests (pending-account-lifecycle -- isolated database)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_disposable_s2_pending_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_disposable_s2_pending_test?schema=public
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-min-32-chars-long-for-ci-environment' }}
          NODE_ENV: test
        run: >-
          npx jest --config jest.integration.config.js --runInBand --ci
          --testPathPattern='pending-account-lifecycle\.real\.test\.ts'

      - name: Run integration tests (P0-D parent onboarding -- isolated database + Mailpit)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_disposable_p0d_parent_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_disposable_p0d_parent_test?schema=public
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-min-32-chars-long-for-ci-environment' }}
          NODE_ENV: test
          MAILPIT_API_URL: http://localhost:8025
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: '1025'
        run: >-
          npx jest --config jest.integration.config.js --runInBand --ci
          --testPathPattern='(activation-domain-separation|parent-registration-atomicity|parent-email-onboarding)\.real\.test\.ts'

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-logs
          path: |
            *.log
            npm-debug.log*
          retention-days: 7
          if-no-files-found: ignore

  # ===========================================================================
  # JOB 5: REAL DATABASE INTEGRATION EVIDENCE
  # ===========================================================================
  real-db-integration:
    name: Real DB Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: nexus_ci_evidence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus_ci_evidence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://postgres:${{ github.run_id }}@localhost:5432/nexus_ci_evidence
        run: npx prisma generate

      - name: Apply existing database migrations
        env:
          DATABASE_URL: postgresql://postgres:${{ github.run_id }}@localhost:5432/nexus_ci_evidence
        run: npx prisma migrate deploy

      - name: Run non-Bilan real database suites
        env:
          DATABASE_URL: postgresql://postgres:${{ github.run_id }}@localhost:5432/nexus_ci_evidence
          TEST_DATABASE_URL: postgresql://postgres:${{ github.run_id }}@localhost:5432/nexus_ci_evidence?schema=public
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ${{ github.sha }}
          NODE_ENV: test
        run: |
          npx jest \
            --config jest.integration.config.js \
            --runInBand \
            --ci \
            --runTestsByPath \
            __tests__/integration/activate-student.real.test.ts \
            __tests__/integration/predict-ownership.real.test.ts \
            __tests__/security/idor-real.test.ts

      - name: Upload real database logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-db-integration-logs
          path: |
            *.log
            npm-debug.log*
          retention-days: 7
          if-no-files-found: ignore

  # ===========================================================================
  # JOB 6: E2E TESTS (with Playwright + E2E DB)
  # ===========================================================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_DISPOSABLE_STACK: '1'

    services:
      postgres-e2e:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis-e2e:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Prepare isolated NPC storage
        shell: bash
        run: |
          set -Eeuo pipefail
          npc_storage_root="$RUNNER_TEMP/npc-storage"
          install -d -m 0700 -- "$npc_storage_root"
          canonical_storage_root="$(realpath -- "$npc_storage_root")"
          canonical_workspace="$(realpath -- "$GITHUB_WORKSPACE")"
          case "$canonical_storage_root/" in
            "$canonical_workspace/"*)
              echo 'NPC storage must remain outside the checked-out release.' >&2
              exit 1
              ;;
          esac
          printf 'NPC_STORAGE_ROOT=%s\n' "$canonical_storage_root" >> "$GITHUB_ENV"

      - name: Prepare isolated document storage
        # DOCUMENT_STORAGE_ROOT est obligatoire (fail-closed) dès que
        # NODE_ENV=production — même contrat qu'en prod : racine persistante
        # HORS de l'arbre de release/build. Ici : répertoire éphémère du
        # runner, même pattern que NPC_STORAGE_ROOT (#120). On complète
        # l'environnement de CI, on n'affaiblit pas le garde.
        shell: bash
        run: |
          set -Eeuo pipefail
          document_storage_root="$RUNNER_TEMP/document-storage"
          install -d -m 0700 -- "$document_storage_root"
          canonical_storage_root="$(realpath -- "$document_storage_root")"
          canonical_workspace="$(realpath -- "$GITHUB_WORKSPACE")"
          case "$canonical_storage_root/" in
            "$canonical_workspace/"*)
              echo 'Document storage must remain outside the checked-out release.' >&2
              exit 1
              ;;
          esac
          printf 'DOCUMENT_STORAGE_ROOT=%s\n' "$canonical_storage_root" >> "$GITHUB_ENV"

      - name: Wait for Postgres (E2E) to be ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5433 -U postgres; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres... ($i/30)"
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Seed E2E test data
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/nexus_e2e
        run: |
          npx prisma db execute --schema=prisma/schema.prisma --stdin <<SQL
          DROP SCHEMA IF EXISTS public CASCADE;
          CREATE SCHEMA public;
          SQL
          npx prisma migrate deploy
          npx tsx scripts/seed-e2e-db.ts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Next.js for E2E
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/nexus_e2e
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-min-32-chars-long-for-ci-environment' }}
          AUTH_TRUST_HOST: 'true'
          OPENAI_API_KEY: sk-test-mock-key-for-ci-build-only
          NODE_ENV: production
          # "next build"'s own type-check pass (not the separate, fast
          # `tsc --noEmit` typecheck job) OOMs on the runner's default V8
          # heap ceiling (~2GB) once the type surface grows past a point --
          # confirmed via the OOM log itself ("Scavenge 2042.9 (2084.5)").
          # This is a memory ceiling, not a type error: raising the ceiling
          # is correct here, disabling type-checking would not be.
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build:e2e

      - name: Start Next.js server in background
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/nexus_e2e
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-min-32-chars-long-for-ci-environment' }}
          AUTH_TRUST_HOST: 'true'
          OPENAI_API_KEY: sk-test-mock-key-for-ci-build-only
          NODE_ENV: production
          RATE_LIMIT_DISABLE: '1'
          # lib/env-validation.ts fails fast in production without these --
          # RATE_LIMIT_DISABLE alone does not satisfy that check (it isn't
          # read by lib/rate-limit/runtime.ts at all). memory backend is
          # explicitly refused when NODE_ENV=production
          # (assertRateLimitRuntimeConfiguration throws
          # RATE_LIMIT_PRODUCTION_MEMORY_REFUSED), so this job gets its own
          # throwaway redis-e2e service above instead (mirrors
          # docker-compose.e2e.yml).
          RATE_LIMIT_BACKEND: redis
          REDIS_URL: redis://localhost:6380
          RATE_LIMIT_KEY_SECRET: ci-e2e-rate-limit-key-secret-placeholder-32chars
          RATE_LIMIT_KEY_NAMESPACE: nexus-ci-e2e
          RATE_LIMIT_TRUST_PROXY_HOPS: '1'
          # Same fail-fast reason for the email outbox scheduler
          # (lib/email/outbox-scheduler.ts, startEmailOutboxScheduler):
          # EMAIL_OUTBOX_WORKER_CONFIGURATION_REQUIRED in production unless
          # EMAIL_OUTBOX_WORKER_ENABLED=true, plus a valid encryption key and
          # SMTP shape -- no real delivery happens in this smoke, only the
          # boot-time config needs to be valid (mirrors docker-compose.e2e.yml).
          EMAIL_OUTBOX_WORKER_ENABLED: 'true'
          EMAIL_OUTBOX_ENCRYPTION_KEY: ci-e2e-outbox-encryption-key-0123456789
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: '1025'
          SMTP_FROM: ci-e2e@example.test
          ARIA_TURN_RECOVERY_WORKER_ENABLED: 'true'
          ARIA_TURN_RECOVERY_POLL_INTERVAL_MS: '1000'
        run: |
          cp -r .next/static .next/standalone/.next/static 2>/dev/null || true
          cp -r public .next/standalone/public 2>/dev/null || true
          node .next/standalone/server.js &
          echo $! > .next-server.pid
          for i in {1..30}; do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Server + Health API ready"
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
          echo "Server failed to start (health endpoint not responding)"
          curl -v http://localhost:3000/api/health 2>&1 || true
          exit 1

      - name: Run Playwright E2E tests
        timeout-minutes: 20
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/nexus_e2e
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-min-32-chars-long-for-ci-environment' }}
          AUTH_TRUST_HOST: 'true'
          REUSE_EXISTING_SERVER: 'true'
        run: npx playwright test --config=playwright.ci.config.ts --project=chromium

      - name: Stop Next.js server
        if: always()
        run: |
          if [ -f .next-server.pid ]; then
            kill $(cat .next-server.pid) || true
            rm .next-server.pid
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload E2E logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: |
            *.log
            npm-debug.log*
            .next/trace
          retention-days: 7
          if-no-files-found: ignore

  # ===========================================================================
  # JOB 7: SECURITY SCANNING
  # ===========================================================================
  e2e-auth:
    name: E2E Parcours Authentifiés
    # Ferme l'angle mort structurel : les specs de e2e/auth (gate incrémental
    # playwright.auth.config.ts — golden-path bilan, RBAC, activation, cycle de
    # vie parent…) n'étaient invoqués par AUCUN job CI. Les deux défauts
    # historiques (bilan invisible après consentement, blocage anti-doublon) et
    # le foyer sans e-mail invisible sont passés à travers des CI vertes pour
    # cette raison. Ce job les exécute contre le vrai standalone, avec le
    # worker bilan en process (BILAN_WORKER_ENABLED) et Mailpit pour les
    # e-mails d'activation. Requis via l'agrégat CI Success.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_DISPOSABLE_STACK: '1'

    services:
      postgres-e2e:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis-e2e:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.30.6
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget -qO- http://localhost:8025/api/v1/info || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Prepare isolated NPC storage
        shell: bash
        run: |
          set -Eeuo pipefail
          npc_storage_root="$RUNNER_TEMP/npc-storage"
          install -d -m 0700 -- "$npc_storage_root"
          canonical_storage_root="$(realpath -- "$npc_storage_root")"
          canonical_workspace="$(realpath -- "$GITHUB_WORKSPACE")"
          case "$canonical_storage_root/" in
            "$canonical_workspace/"*)
              echo 'NPC storage must remain outside the checked-out release.' >&2
              exit 1
              ;;
          esac
          printf 'NPC_STORAGE_ROOT=%s\n' "$canonical_storage_root" >> "$GITHUB_ENV"

      - name: Prepare isolated document storage
        shell: bash
        run: |
          set -Eeuo pipefail
          document_storage_root="$RUNNER_TEMP/document-storage"
          install -d -m 0700 -- "$document_storage_root"
          canonical_storage_root="$(realpath -- "$document_storage_root")"
          canonical_workspace="$(realpath -- "$GITHUB_WORKSPACE")"
          case "$canonical_storage_root/" in
            "$canonical_workspace/"*)
              echo 'Document storage must remain outside the checked-out release.' >&2
              exit 1
              ;;
          esac
          printf 'DOCUMENT_STORAGE_ROOT=%s\n' "$canonical_storage_root" >> "$GITHUB_ENV"

      - name: Wait for Postgres (E2E) to be ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5433 -U postgres; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres... ($i/30)"
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Seed E2E test data
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/nexus_e2e
        run: |
          npx prisma db execute --schema=prisma/schema.prisma --stdin <<SQL
          DROP SCHEMA IF EXISTS public CASCADE;
          CREATE SCHEMA public;
          SQL
          npx prisma migrate deploy
          npx tsx scripts/seed-e2e-db.ts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Next.js for E2E
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/nexus_e2e
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-min-32-chars-long-for-ci-environment' }}
          AUTH_TRUST_HOST: 'true'
          OPENAI_API_KEY: sk-test-mock-key-for-ci-build-only
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build:e2e

      - name: Start Next.js server in background (worker bilan actif)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/nexus_e2e
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-min-32-chars-long-for-ci-environment' }}
          AUTH_TRUST_HOST: 'true'
          OPENAI_API_KEY: sk-test-mock-key-for-ci-build-only
          NODE_ENV: production
          RATE_LIMIT_DISABLE: '1'
          RATE_LIMIT_BACKEND: redis
          REDIS_URL: redis://localhost:6380
          RATE_LIMIT_KEY_SECRET: ci-e2e-rate-limit-key-secret-placeholder-32chars
          RATE_LIMIT_KEY_NAMESPACE: nexus-ci-e2e-auth
          RATE_LIMIT_TRUST_PROXY_HOPS: '1'
          EMAIL_OUTBOX_WORKER_ENABLED: 'true'
          EMAIL_OUTBOX_ENCRYPTION_KEY: ci-e2e-outbox-encryption-key-0123456789
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: '1025'
          SMTP_FROM: ci-e2e-auth@example.test
          # Le pipeline bilan (scoring + génération) tourne en process, comme
          # en prod : sans lui, le golden-path et le parcours saisie papier ne
          # peuvent pas avancer au-delà de la soumission.
          BILAN_WORKER_ENABLED: 'true'
          NEXUS_BILAN_PACK_ENTREE_SECONDE_MATHS_V1_ENABLED: 'true'
          ARIA_TURN_RECOVERY_WORKER_ENABLED: 'true'
          ARIA_TURN_RECOVERY_POLL_INTERVAL_MS: '1000'
        run: |
          cp -r .next/static .next/standalone/.next/static 2>/dev/null || true
          cp -r public .next/standalone/public 2>/dev/null || true
          node .next/standalone/server.js &
          echo $! > .next-server.pid
          for i in {1..30}; do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Server + Health API ready"
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
          echo "Server failed to start (health endpoint not responding)"
          curl -v http://localhost:3000/api/health 2>&1 || true
          exit 1

      - name: Alias redis-e2e vers le service Redis jetable
        # Le garde fail-closed de e2e/helpers/rate-limit.ts n'accepte QUE le
        # hostname `redis-e2e` (le DNS du compose jetable) — on ne l'affaiblit
        # pas : on donne au runner le même nom, pointé sur le service du job.
        run: echo "127.0.0.1 redis-e2e" | sudo tee -a /etc/hosts

      - name: Run Playwright auth E2E gate
        timeout-minutes: 25
        env:
          BASE_URL: http://localhost:3000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/nexus_e2e
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-min-32-chars-long-for-ci-environment' }}
          AUTH_TRUST_HOST: 'true'
          MAILPIT_API_URL: http://localhost:8025
          # Le helper de remise à zéro du rate-limit (e2e/helpers/rate-limit.ts)
          # exige cette URL dès que E2E_DISPOSABLE_STACK=1 — même Redis jetable
          # que le serveur (alias /etc/hosts ci-dessus), base dédiée.
          E2E_DISPOSABLE_REDIS_URL: redis://redis-e2e:6380/0
          NEXUS_BILAN_PACK_ENTREE_SECONDE_MATHS_V1_ENABLED: 'true'
        run: npx playwright test --config=playwright.auth.config.ts --project=chromium

      - name: Stop Next.js server
        if: always()
        run: |
          if [ -f .next-server.pid ]; then
            kill $(cat .next-server.pid) || true
            rm .next-server.pid
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-auth-report
          path: playwright-report/
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      # --- SEMGREP ---
      - name: Install Semgrep
        run: pip3 install semgrep

      - name: Run Semgrep
        run: |
          set +e
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --config p/typescript \
            --config p/nextjs \
            --json --output semgrep-report.json \
            .
          semgrep_code=$?
          set -e
          echo "SEMGREP_EXIT_CODE=$semgrep_code"

          # Evaluate results
          if [ "$semgrep_code" -gt 1 ]; then
            echo "Semgrep: scanner error (code=$semgrep_code)"
            exit 1
          fi

          if [ ! -f semgrep-report.json ]; then
            echo "Semgrep: report file not generated — scanner failure"
            exit 1
          fi

          # Parse and evaluate findings
          python3 - <<'PYEOF'
          import json, sys

          with open('semgrep-report.json') as f:
              data = json.load(f)

          results = data.get('results', [])

          # Paths excluded from blocking (tests, CI scripts, seed data)
          # These are still reported but don't fail the build.
          non_blocking_prefixes = (
              '__tests__/', 'e2e/', 'scripts/release/', 'scripts/seed-',
              'scripts/gate-', 'test-results/', 'playwright-report/',
          )

          def is_blocking_path(path):
              return not any(path.startswith(p) for p in non_blocking_prefixes)

          secrets = [r for r in results
                     if 'secrets' in str(r.get('check_id', ''))
                     and is_blocking_path(r.get('path', ''))]
          errors_list = [r for r in results
                         if r.get('extra', {}).get('severity', '') == 'ERROR'
                         and is_blocking_path(r.get('path', ''))]
          critical_high = [r for r in results
                           if r.get('extra', {}).get('metadata', {}).get('impact', '').upper() in ('CRITICAL', 'HIGH')
                           and is_blocking_path(r.get('path', ''))]

          # Report all findings
          for r in results:
              sev = r.get('extra', {}).get('severity', 'UNKNOWN')
              path = r.get('path', '?')
              line = r.get('start', {}).get('line', '?')
              blocking = is_blocking_path(path)
              tag = 'BLOCK' if blocking else 'INFO'
              print(f"{tag} {sev}: {r.get('check_id', '?')} at {path}:{line}")

          total_blocking = len(secrets) + len(errors_list) + len(critical_high)
          print(f"\nBlocking: {total_blocking} (secrets={len(secrets)}, errors={len(errors_list)}, critical_high={len(critical_high)})")
          print(f"Total findings: {len(results)}")

          if total_blocking > 0:
              print("Semgrep: blocking findings detected in application code")
              sys.exit(1)

          print("Semgrep: no blocking findings in application code")
          PYEOF

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-report
          path: semgrep-report.json
          retention-days: 7
          if-no-files-found: ignore

      # --- OSV SCANNER (Google) ---
      - name: Install and verify OSV Scanner
        run: |
          for attempt in 1 2 3 4 5; do
            rm -f osv-scanner
            curl -sSL --retry 5 --retry-delay 5 --retry-all-errors \
              https://github.com/google/osv-scanner/releases/download/v1.9.0/osv-scanner_linux_amd64 -o osv-scanner
            if echo "d9c1deedc23372a25049458e1e2f2bb9ad4098e2e2038118b9fec42f28f93ffb  osv-scanner" | sha256sum -c; then
              break
            fi
            echo "Checksum mismatch on attempt $attempt (corrupted/truncated download) — retrying..."
            sleep 5
          done
          echo "d9c1deedc23372a25049458e1e2f2bb9ad4098e2e2038118b9fec42f28f93ffb  osv-scanner" | sha256sum -c
          chmod +x osv-scanner

      - name: Run OSV Scanner
        run: ./osv-scanner --lockfile=package-lock.json --format=json --output=osv-report.json

      - name: Upload OSV report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-report
          path: osv-report.json
          retention-days: 7
          if-no-files-found: ignore

  # ===========================================================================
  # JOB 8: BUILD PRODUCTION
  # ===========================================================================
  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_prod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Prepare isolated NPC storage
        shell: bash
        run: |
          set -Eeuo pipefail
          npc_storage_root="$RUNNER_TEMP/npc-storage"
          install -d -m 0700 -- "$npc_storage_root"
          canonical_storage_root="$(realpath -- "$npc_storage_root")"
          canonical_workspace="$(realpath -- "$GITHUB_WORKSPACE")"
          case "$canonical_storage_root/" in
            "$canonical_workspace/"*)
              echo 'NPC storage must remain outside the checked-out release.' >&2
              exit 1
              ;;
          esac
          printf 'NPC_STORAGE_ROOT=%s\n' "$canonical_storage_root" >> "$GITHUB_ENV"

      - name: Prepare isolated document storage
        # Même contrat que le job E2E : DOCUMENT_STORAGE_ROOT fail-closed en
        # production, fourni par l'environnement, hors arbre de build.
        shell: bash
        run: |
          set -Eeuo pipefail
          document_storage_root="$RUNNER_TEMP/document-storage"
          install -d -m 0700 -- "$document_storage_root"
          canonical_storage_root="$(realpath -- "$document_storage_root")"
          canonical_workspace="$(realpath -- "$GITHUB_WORKSPACE")"
          case "$canonical_storage_root/" in
            "$canonical_workspace/"*)
              echo 'Document storage must remain outside the checked-out release.' >&2
              exit 1
              ;;
          esac
          printf 'DOCUMENT_STORAGE_ROOT=%s\n' "$canonical_storage_root" >> "$GITHUB_ENV"

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply branch migrations to production smoke database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_prod
        run: npx prisma migrate deploy

      - name: Build Next.js production bundle
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_prod
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-min-32-chars-long-for-ci-environment' }}
          OPENAI_API_KEY: sk-test-mock-key-for-ci-build-only
          NODE_ENV: production
          # See the matching comment on the E2E job's "Build Next.js for
          # E2E" step -- same OOM, same fix, same reasoning.
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Validate Next.js traces
        run: npm run artifact:traces

      - name: Audit production standalone artifact
        run: npm run artifact:audit

      - name: Forbidden pedagogical artifacts (production artifact)
        # Scanne l'arbre EXACTEMENT uploadé par « Upload build artifacts »
        # (path: .next/), qui contient le standalone déployé. Le même moteur que
        # pour les sources : seule la racine change. Une racine absente fait
        # échouer le contrôle plutôt que de le déclarer propre.
        run: npm run security:forbidden-artifacts:artifact

      - name: Smoke test standalone server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_prod
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: test-secret-min-32-chars-long-for-ci-environment
          NODE_ENV: production
          # lib/env-validation.ts fails fast in production without these --
          # see the matching comment on the E2E job's "Start Next.js server
          # in background" step and docker-compose.e2e.yml for the full
          # rationale. memory backend is explicitly refused in production,
          # so this job gets its own throwaway redis service above instead.
          RATE_LIMIT_BACKEND: redis
          REDIS_URL: redis://localhost:6379
          RATE_LIMIT_KEY_SECRET: ci-build-rate-limit-key-secret-placeholder-32ch
          RATE_LIMIT_KEY_NAMESPACE: nexus-ci-build
          RATE_LIMIT_TRUST_PROXY_HOPS: '1'
          # Same fail-fast reason for the email outbox scheduler -- see the
          # matching comment on the E2E job's "Start Next.js server in
          # background" step.
          EMAIL_OUTBOX_WORKER_ENABLED: 'true'
          EMAIL_OUTBOX_ENCRYPTION_KEY: ci-build-outbox-encryption-key-0123456789
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: '1025'
          SMTP_FROM: ci-build@example.test
          ARIA_TURN_RECOVERY_WORKER_ENABLED: 'true'
          ARIA_TURN_RECOVERY_POLL_INTERVAL_MS: '1000'
        run: |
          node .next/standalone/server.js &
          SERVER_PID=$!
          for i in {1..20}; do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Standalone server healthy"
              kill $SERVER_PID || true
              exit 0
            fi
            sleep 2
          done
          echo "Standalone server did not respond to /api/health"
          kill $SERVER_PID || true
          exit 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextjs-build
          path: .next/
          retention-days: 7
          if-no-files-found: ignore

      - name: Check build size
        run: |
          echo "### Build Size Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -sh .next/ 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "(standalone output)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # ARIA-B QUALIFICATION: HERMETIC JEST LANES
  # ===========================================================================
  aria-jest:
    name: ARIA Jest (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: unit
            script: test:aria:unit
            artifactPath: .artifacts/aria/ci/unit
          - lane: api
            script: test:aria:api
            artifactPath: .artifacts/aria/ci/api
          - lane: integration
            script: test:aria:integration
            artifactPath: .artifacts/aria/ci/integration
          - lane: sse
            script: test:aria:sse
            artifactPath: .artifacts/aria/ci/sse
          - lane: architecture
            script: test:aria:architecture
            artifactPath: .artifacts/aria/ci/architecture

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install exact dependencies
        run: |
          npm install -g npm@${{ env.NPM_VERSION }}
          npm ci

      - name: Run canonical ARIA Jest lane
        run: npm run ${{ matrix.script }}

      - name: Seal ARIA Jest result
        if: always()
        env:
          ARIA_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "${{ matrix.artifactPath }}"
          git rev-parse HEAD > "${{ matrix.artifactPath }}/head.sha"
          printf '%s\n' "$ARIA_JOB_STATUS" > "${{ matrix.artifactPath }}/job-status.txt"

      - name: Upload exact ARIA Jest evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aria-jest-${{ matrix.lane }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ matrix.artifactPath }}/
          retention-days: 30
          if-no-files-found: error

  # ===========================================================================
  # ARIA-B QUALIFICATION: REAL POSTGRESQL LANES
  # ===========================================================================
  aria-postgres:
    name: ARIA PostgreSQL (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - lane: db
            script: test:aria:db
            artifactPath: .artifacts/aria/ci/db
          - lane: concurrency
            script: test:aria:concurrency
            artifactPath: .artifacts/aria/ci/concurrency
          - lane: migrations
            script: test:aria:migrations
            artifactPath: .artifacts/aria/ci/migrations
          - lane: backfills
            script: test:aria:backfills
            artifactPath: .artifacts/aria/ci/backfills

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install exact dependencies
        run: |
          npm install -g npm@${{ env.NPM_VERSION }}
          npm ci

      - name: Run canonical ARIA PostgreSQL lane
        run: npm run ${{ matrix.script }}

      - name: Seal ARIA PostgreSQL result
        if: always()
        env:
          ARIA_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "${{ matrix.artifactPath }}"
          git rev-parse HEAD > "${{ matrix.artifactPath }}/head.sha"
          printf '%s\n' "$ARIA_JOB_STATUS" > "${{ matrix.artifactPath }}/job-status.txt"

      - name: Upload exact ARIA PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aria-postgres-${{ matrix.lane }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ matrix.artifactPath }}/
          retention-days: 30
          if-no-files-found: error

  # ===========================================================================
  # ARIA-B QUALIFICATION: STATIC CONTRACT AND RELEASE GATES
  # ===========================================================================
  aria-static:
    name: ARIA Static (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: enum-drift
            script: aria:enum-drift
            artifactPath: .artifacts/aria/ci/enum-drift
          - lane: scripts-typecheck
            script: typecheck:aria-scripts
            artifactPath: .artifacts/aria/ci/scripts-typecheck
          - lane: security
            script: aria:security
            artifactPath: .artifacts/aria/ci/security
          - lane: manifest
            script: aria:manifest:check
            artifactPath: .artifacts/aria/ci/manifest
          - lane: contracts
            script: aria:contracts:check
            artifactPath: .artifacts/aria/ci/contracts
          - lane: resource-registry
            script: aria:resource-registry:check
            artifactPath: .artifacts/aria/ci/resource-registry
          - lane: performance
            script: aria:performance:check
            artifactPath: .artifacts/aria/ci/performance
          - lane: reachability
            script: aria:reachability
            artifactPath: .artifacts/aria/ci/reachability
          - lane: integrity
            script: aria:integrity
            artifactPath: .artifacts/aria/ci/integrity
          - lane: zero-test-debt
            script: test:zero-debt
            artifactPath: .artifacts/aria/ci/zero-test-debt
          - lane: evaluation-contract
            script: aria:evaluate:check
            artifactPath: .artifacts/aria/ci/evaluation-contract
          - lane: source-artifact
            script: aria:artifact:source-check
            artifactPath: .artifacts/aria/ci/source-artifact

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Resolve locked RAG companion
        if: ${{ matrix.lane == 'contracts' }}
        id: rag-lock
        run: npm run aria:contracts:lock:emit

      - name: Checkout locked public RAG companion
        if: ${{ matrix.lane == 'contracts' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.rag-lock.outputs.producer_repository }}
          ref: ${{ steps.rag-lock.outputs.producer_commit }}
          path: .aria-rag-contract-producer
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install exact dependencies
        run: |
          npm install -g npm@${{ env.NPM_VERSION }}
          npm ci

      - name: Run canonical ARIA static gate
        env:
          ARIA_RAG_WORKTREE: ${{ github.workspace }}/.aria-rag-contract-producer
          ARIA_RAG_EXPECTED_SHA: ${{ steps.rag-lock.outputs.producer_commit }}
        run: npm run ${{ matrix.script }}

      - name: Prove static gates do not mutate source
        run: git diff --exit-code

      - name: Seal ARIA static result
        if: always()
        env:
          ARIA_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "${{ matrix.artifactPath }}"
          git rev-parse HEAD > "${{ matrix.artifactPath }}/head.sha"
          printf '%s\n' "$ARIA_JOB_STATUS" > "${{ matrix.artifactPath }}/job-status.txt"

      - name: Upload exact ARIA static evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aria-static-${{ matrix.lane }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ matrix.artifactPath }}/
          retention-days: 30
          if-no-files-found: error

  # ===========================================================================
  # ARIA-B QUALIFICATION: EXACT-HEAD COVERAGE
  # ===========================================================================
  aria-coverage:
    name: ARIA Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install exact dependencies
        run: |
          npm install -g npm@${{ env.NPM_VERSION }}
          npm ci

      - name: Generate canonical ARIA coverage
        run: npm run test:aria:coverage

      - name: Enforce canonical ARIA coverage
        run: npm run aria:coverage:check

      - name: Upload exact ARIA coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aria-coverage-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: .artifacts/aria/coverage/
          retention-days: 30
          if-no-files-found: error

  # ===========================================================================
  # ARIA-B QUALIFICATION: PRODUCT BROWSER LANES
  # ===========================================================================
  aria-browser:
    name: ARIA Browser (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - lane: desktop
            script: test:aria:e2e:desktop
            artifactPath: .artifacts/aria
          - lane: mobile
            script: test:aria:e2e:mobile
            artifactPath: .artifacts/aria
          - lane: a11y
            script: test:aria:a11y
            artifactPath: .artifacts/aria
          - lane: smoke
            script: aria:smoke:production-artifact
            artifactPath: .artifacts/aria

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install exact dependencies
        run: |
          npm install -g npm@${{ env.NPM_VERSION }}
          npm ci

      - name: Run canonical ARIA browser lane
        run: npm run ${{ matrix.script }}

      - name: Seal ARIA browser result
        if: always()
        env:
          ARIA_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "${{ matrix.artifactPath }}"
          git rev-parse HEAD > "${{ matrix.artifactPath }}/head.sha"
          printf '%s\n' "$ARIA_JOB_STATUS" > "${{ matrix.artifactPath }}/job-status.txt"

      - name: Upload exact ARIA browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aria-browser-${{ matrix.lane }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ matrix.artifactPath }}/
          retention-days: 30
          if-no-files-found: error

  # ===========================================================================
  # ARIA-B QUALIFICATION: EXACT-HEAD REQUIREMENT EVIDENCE
  # ===========================================================================
  aria-evidence:
    name: ARIA Requirement Evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs:
      - aria-jest
      - aria-postgres
      - aria-browser

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install exact dependencies
        run: |
          npm install -g npm@${{ env.NPM_VERSION }}
          npm ci

      - name: Download exact-head browser evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: aria-browser-*-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: .artifacts/aria
          merge-multiple: true

      - name: Generate canonical Jest requirement evidence
        run: npm run aria:test-evidence:jest

      - name: Requalify exact-head ARIA visual evidence
        run: npm run aria:visual-evidence:check

      - name: Enforce requirement-to-test traceability
        run: npm run aria:test-plan:check

      - name: Upload exact ARIA requirement evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aria-evidence-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: .artifacts/aria/qualification/
          retention-days: 30
          if-no-files-found: error

  # ===========================================================================
  # JOB 9: FROZEN PUBLIC DOCUMENT VERIFICATION
  # ===========================================================================
  documents:
    name: Documents
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install PDF verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-venv qpdf
          python3 -m venv "$RUNNER_TEMP/pre-rentree-verify"
          "$RUNNER_TEMP/pre-rentree-verify/bin/python" -m pip install \
            -r scripts/pre-rentree/requirements.lock
          echo "$RUNNER_TEMP/pre-rentree-verify/bin" >> "$GITHUB_PATH"

      - name: Verify frozen public PDFs
        run: |
          npm run pre-rentree:public-pdfs:verify
          git diff --exit-code
          test -z "$(git status --short)"

  # ===========================================================================
  # JOB 10: STATUS CHECK (All jobs must pass)
  # ===========================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - dependency-integrity
      - lint
      - typecheck
      - unit
      - integration
      - real-db-integration
      - e2e
      - e2e-auth
      - security
      - build
      - documents
      - bilan-runtime-real-db
      - aria-jest
      - aria-postgres
      - aria-static
      - aria-coverage
      - aria-browser
      - aria-evidence
    if: ${{ always() }}

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Assert every direct dependency succeeded
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/github/assert-ci-needs.mjs

  # ===========================================================================
  # JOB: BILAN RUNTIME REAL-DATABASE CONTRACT (A94)
  # ===========================================================================
  bilan-runtime-real-db:
    name: Bilan Runtime Real-DB Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_bilan_runtime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus_bilan_runtime_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_bilan_runtime_test?schema=public
        run: npx prisma generate

      - name: Apply branch migrations to the isolated database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_bilan_runtime_test?schema=public
        run: npx prisma migrate deploy

      - name: Run the Bilan runtime schema contract
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_bilan_runtime_test?schema=public
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_bilan_runtime_test?schema=public
          NEXTAUTH_SECRET: test-secret-min-32-chars-long-for-ci-environment
          NEXTAUTH_URL: http://localhost:3000
        run: >-
          ./node_modules/.bin/jest --config jest.integration.config.js --runInBand --ci
          __tests__/lib/bilan-runtime/bilan-schema.real.test.ts
