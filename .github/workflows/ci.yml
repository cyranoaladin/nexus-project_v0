# =============================================================================
# CI Pipeline - Nexus Reussite
# =============================================================================
#
# Pipeline with independent dependency, quality, test, security, build, and
# document evidence. All jobs must pass for merge into main.
#
# Triggers:
# - Pull requests vers main or the frozen PR #79 release branch
# - Push sur main (pour verifier apres merge)
#
# Jobs:
# 0. dependency-integrity - npm ci + tree validation + audit
# 1. lint                 - ESLint check
# 2. typecheck            - TypeScript validation
# 3. unit                 - Tests unitaires (jsdom, pas de DB)
# 4. integration          - Tests integration (node + PostgreSQL)
# 5. real-db-integration  - 3 suites / 10 tests PostgreSQL non-Bilan
# 6. e2e                  - Tests E2E (Playwright + app demarree + DB E2E)
# 7. security             - semgrep + OSV scanner
# 8. build                - Next.js production build + artifact audit
# 9. documents            - Verification des 7 PDF publics figes
#
# =============================================================================

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - release/pre-rentree-2026-public-ready

# Cancel in-progress runs when new commits pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.23.1'
  NPM_VERSION: '10.9.8'
  # CI optimizations
  CI: true
  FORCE_COLOR: 1
  # Optional notifications are fail-closed in CI and never receive credentials.
  TELEGRAM_NOTIFICATIONS_ENABLED: 'false'

jobs:
  # ===========================================================================
  # JOB 0: DEPENDENCY INTEGRITY
  # ===========================================================================
  dependency-integrity:
    name: Dependency Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm version
        run: |
          npm install -g npm@${{ env.NPM_VERSION }}
          node --version
          npm --version
          test "$(node --version)" = "v${{ env.NODE_VERSION }}"
          test "$(npm --version)" = "${{ env.NPM_VERSION }}"

      - name: Install dependencies
        run: npm ci

      - name: Validate npm tree
        run: |
          npm ls --all --json --long > /tmp/npm-tree.json
          node scripts/validate-npm-tree.js \
            --tree /tmp/npm-tree.json \
            --exceptions security/npm-tree-exceptions.json

      - name: Generate SBOM
        run: npm run sbom:runtime

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --json > npm-audit-production.json

      - name: Audit all dependencies with exact time-bound policy
        run: |
          set +e
          npm audit --audit-level=high --json > npm-audit-full.json
          audit_code=$?
          set -e
          echo "FULL_AUDIT_EXIT_CODE=$audit_code"
          if [ "$audit_code" -eq 0 ]; then
            echo "Full npm audit is green; no exception consumed."
          elif [ "$audit_code" -eq 1 ]; then
            node scripts/security/validate-brace-expansion-attestation.mjs \
              --mode npm \
              --attestation security/brace-expansion-backport-attestation.json \
              --lockfile package-lock.json \
              --now "$(date --iso-8601=seconds)" \
              --report npm-audit-full.json \
              --production-audit npm-audit-production.json \
              --runtime-sbom security/sbom/runtime.cdx.json
          else
            echo "npm audit scanner failed with exit code $audit_code"
            exit "$audit_code"
          fi

      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-integrity-evidence
          path: |
            npm-audit-production.json
            npm-audit-full.json
            security/sbom/runtime.cdx.json
          retention-days: 30
          if-no-files-found: error

  # ===========================================================================
  # JOB 1: LINT
  # ===========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Security repo scan
        run: npm run security:repo

      - name: Run ESLint
        run: npm run lint

      - name: Check docs archive placement
        run: npm run check:docs-archive

  # ===========================================================================
  # JOB 2: TYPECHECK
  # ===========================================================================
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check TypeScript errors with threshold
        run: node .github/scripts/check-typescript-errors.js 0

  # ===========================================================================
  # JOB 3: UNIT TESTS
  # ===========================================================================
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Install PDF tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils texlive-latex-base texlive-latex-recommended
          pdflatex --version
          pdfinfo -v
          pdftotext -v
          pdfimages -v

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run unit tests
        run: npm test -- --ci --coverage --maxWorkers=2
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_test
          NEXTAUTH_SECRET: test-secret-min-32-chars-long-for-ci-environment
          NEXTAUTH_URL: http://localhost:3000

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 7

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-logs
          path: |
            *.log
            npm-debug.log*
          retention-days: 7
          if-no-files-found: ignore

  # ===========================================================================
  # JOB 4: INTEGRATION TESTS (with PostgreSQL)
  # ===========================================================================
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres to be ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres... ($i/30)"
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Create .env.test for test database
        run: |
          echo 'DATABASE_URL="postgresql://postgres:postgres@localhost:5432/nexus_test?schema=public"' > .env.test
          echo 'TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/nexus_test?schema=public"' >> .env.test
          echo 'NODE_ENV="test"' >> .env.test
          printf '%s=%s\n' 'NEXTAUTH_SECRET' 'test-secret-min-32-chars-long-for-ci-environment' >> .env.test
          echo 'NEXTAUTH_URL="http://localhost:3000"' >> .env.test

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_test
        run: npx prisma generate

      - name: Reset database before migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_test
        run: |
          npx prisma db execute --schema=prisma/schema.prisma --stdin <<SQL
          DROP SCHEMA IF EXISTS public CASCADE;
          CREATE SCHEMA public;
          SQL

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_test
        run: npx prisma migrate deploy

      - name: Verify database tables
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_test
        run: |
          npx prisma db execute --schema=prisma/schema.prisma --stdin <<SQL
          SELECT table_name FROM information_schema.tables
          WHERE table_schema = 'public' AND table_type = 'BASE TABLE'
          ORDER BY table_name;
          SQL

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_test?schema=public
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-min-32-chars-long-for-ci-environment' }}
          NODE_ENV: test
        run: >-
          npx jest --config jest.integration.config.js --runInBand --ci
          --testPathIgnorePatterns='/__tests__/lib/bilan/'

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-logs
          path: |
            *.log
            npm-debug.log*
          retention-days: 7
          if-no-files-found: ignore

  # ===========================================================================
  # JOB 5: REAL DATABASE INTEGRATION EVIDENCE
  # ===========================================================================
  real-db-integration:
    name: Real DB Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: nexus_ci_evidence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus_ci_evidence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://postgres:${{ github.run_id }}@localhost:5432/nexus_ci_evidence
        run: npx prisma generate

      - name: Apply existing database migrations
        env:
          DATABASE_URL: postgresql://postgres:${{ github.run_id }}@localhost:5432/nexus_ci_evidence
        run: npx prisma migrate deploy

      - name: Run non-Bilan real database suites
        env:
          DATABASE_URL: postgresql://postgres:${{ github.run_id }}@localhost:5432/nexus_ci_evidence
          TEST_DATABASE_URL: postgresql://postgres:${{ github.run_id }}@localhost:5432/nexus_ci_evidence?schema=public
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ${{ github.sha }}
          NODE_ENV: test
        run: |
          npx jest \
            --config jest.integration.config.js \
            --runInBand \
            --ci \
            --runTestsByPath \
            __tests__/integration/activate-student.real.test.ts \
            __tests__/integration/predict-ownership.real.test.ts \
            __tests__/security/idor-real.test.ts

      - name: Upload real database logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-db-integration-logs
          path: |
            *.log
            npm-debug.log*
          retention-days: 7
          if-no-files-found: ignore

  # ===========================================================================
  # JOB 6: E2E TESTS (with Playwright + E2E DB)
  # ===========================================================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres-e2e:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres (E2E) to be ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5433 -U postgres; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres... ($i/30)"
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Seed E2E test data
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/nexus_e2e
        run: |
          npx prisma db execute --schema=prisma/schema.prisma --stdin <<SQL
          DROP SCHEMA IF EXISTS public CASCADE;
          CREATE SCHEMA public;
          SQL
          npx prisma migrate deploy
          npx tsx scripts/seed-e2e-db.ts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Next.js for E2E
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/nexus_e2e
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-min-32-chars-long-for-ci-environment' }}
          AUTH_TRUST_HOST: 'true'
          OPENAI_API_KEY: sk-test-mock-key-for-ci-build-only
          NODE_ENV: production
        run: npm run build:e2e

      - name: Start Next.js server in background
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/nexus_e2e
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-min-32-chars-long-for-ci-environment' }}
          AUTH_TRUST_HOST: 'true'
          OPENAI_API_KEY: sk-test-mock-key-for-ci-build-only
          NODE_ENV: production
          RATE_LIMIT_DISABLE: '1'
        run: |
          cp -r .next/static .next/standalone/.next/static 2>/dev/null || true
          cp -r public .next/standalone/public 2>/dev/null || true
          node .next/standalone/server.js &
          echo $! > .next-server.pid
          for i in {1..30}; do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Server + Health API ready"
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
          echo "Server failed to start (health endpoint not responding)"
          curl -v http://localhost:3000/api/health 2>&1 || true
          exit 1

      - name: Run Playwright E2E tests
        timeout-minutes: 20
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/nexus_e2e
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-min-32-chars-long-for-ci-environment' }}
          AUTH_TRUST_HOST: 'true'
          REUSE_EXISTING_SERVER: 'true'
        run: npx playwright test --config=playwright.ci.config.ts --project=chromium

      - name: Stop Next.js server
        if: always()
        run: |
          if [ -f .next-server.pid ]; then
            kill $(cat .next-server.pid) || true
            rm .next-server.pid
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload E2E logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: |
            *.log
            npm-debug.log*
            .next/trace
          retention-days: 7
          if-no-files-found: ignore

  # ===========================================================================
  # JOB 7: SECURITY SCANNING
  # ===========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      # --- SEMGREP ---
      - name: Install Semgrep
        run: pip3 install semgrep

      - name: Run Semgrep
        run: |
          set +e
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --config p/typescript \
            --config p/nextjs \
            --json --output semgrep-report.json \
            .
          semgrep_code=$?
          set -e
          echo "SEMGREP_EXIT_CODE=$semgrep_code"

          # Evaluate results
          if [ "$semgrep_code" -gt 1 ]; then
            echo "Semgrep: scanner error (code=$semgrep_code)"
            exit 1
          fi

          if [ ! -f semgrep-report.json ]; then
            echo "Semgrep: report file not generated — scanner failure"
            exit 1
          fi

          # Parse and evaluate findings
          python3 - <<'PYEOF'
          import json, sys

          with open('semgrep-report.json') as f:
              data = json.load(f)

          results = data.get('results', [])

          # Paths excluded from blocking (tests, CI scripts, seed data)
          # These are still reported but don't fail the build.
          non_blocking_prefixes = (
              '__tests__/', 'e2e/', 'scripts/release/', 'scripts/seed-',
              'scripts/gate-', 'test-results/', 'playwright-report/',
          )

          def is_blocking_path(path):
              return not any(path.startswith(p) for p in non_blocking_prefixes)

          secrets = [r for r in results
                     if 'secrets' in str(r.get('check_id', ''))
                     and is_blocking_path(r.get('path', ''))]
          errors_list = [r for r in results
                         if r.get('extra', {}).get('severity', '') == 'ERROR'
                         and is_blocking_path(r.get('path', ''))]
          critical_high = [r for r in results
                           if r.get('extra', {}).get('metadata', {}).get('impact', '').upper() in ('CRITICAL', 'HIGH')
                           and is_blocking_path(r.get('path', ''))]

          # Report all findings
          for r in results:
              sev = r.get('extra', {}).get('severity', 'UNKNOWN')
              path = r.get('path', '?')
              line = r.get('start', {}).get('line', '?')
              blocking = is_blocking_path(path)
              tag = 'BLOCK' if blocking else 'INFO'
              print(f"{tag} {sev}: {r.get('check_id', '?')} at {path}:{line}")

          total_blocking = len(secrets) + len(errors_list) + len(critical_high)
          print(f"\nBlocking: {total_blocking} (secrets={len(secrets)}, errors={len(errors_list)}, critical_high={len(critical_high)})")
          print(f"Total findings: {len(results)}")

          if total_blocking > 0:
              print("Semgrep: blocking findings detected in application code")
              sys.exit(1)

          print("Semgrep: no blocking findings in application code")
          PYEOF

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-report
          path: semgrep-report.json
          retention-days: 7
          if-no-files-found: ignore

      # --- OSV SCANNER (Google) ---
      - name: Install and verify OSV Scanner
        run: |
          curl -sSL https://github.com/google/osv-scanner/releases/download/v1.9.0/osv-scanner_linux_amd64 -o osv-scanner
          echo "d9c1deedc23372a25049458e1e2f2bb9ad4098e2e2038118b9fec42f28f93ffb  osv-scanner" | sha256sum -c
          chmod +x osv-scanner

      - name: Run OSV Scanner
        run: |
          set +e
          ./osv-scanner --lockfile=package-lock.json --format=json --output=osv-report.json
          osv_code=$?
          set -e
          echo "OSV_EXIT_CODE=$osv_code"
          if [ "$osv_code" -eq 0 ]; then
            echo "OSV Scanner is green; no exception consumed."
          elif [ "$osv_code" -eq 1 ]; then
            node scripts/security/validate-brace-expansion-attestation.mjs \
              --mode osv \
              --attestation security/brace-expansion-backport-attestation.json \
              --lockfile package-lock.json \
              --now "$(date --iso-8601=seconds)" \
              --report osv-report.json
          else
            echo "OSV Scanner: scanner error (code=$osv_code)"
            exit 1
          fi

      - name: Upload OSV report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-report
          path: osv-report.json
          retention-days: 7
          if-no-files-found: ignore

  # ===========================================================================
  # JOB 8: BUILD PRODUCTION
  # ===========================================================================
  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_prod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Pin npm version
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js production bundle
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_prod
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-min-32-chars-long-for-ci-environment' }}
          OPENAI_API_KEY: sk-test-mock-key-for-ci-build-only
          NODE_ENV: production
        run: npm run build

      - name: Validate Next.js traces
        run: npm run artifact:traces

      - name: Audit production standalone artifact
        run: npm run artifact:audit

      - name: Smoke test standalone server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_prod
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: test-secret-min-32-chars-long-for-ci-environment
          NODE_ENV: production
        run: |
          node .next/standalone/server.js &
          SERVER_PID=$!
          for i in {1..20}; do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Standalone server healthy"
              kill $SERVER_PID || true
              exit 0
            fi
            sleep 2
          done
          echo "Standalone server did not respond to /api/health"
          kill $SERVER_PID || true
          exit 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextjs-build
          path: .next/
          retention-days: 7
          if-no-files-found: ignore

      - name: Check build size
        run: |
          echo "### Build Size Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -sh .next/ 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "(standalone output)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # JOB 9: FROZEN PUBLIC DOCUMENT VERIFICATION
  # ===========================================================================
  documents:
    name: Documents
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install PDF verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-venv qpdf
          python3 -m venv "$RUNNER_TEMP/pre-rentree-verify"
          "$RUNNER_TEMP/pre-rentree-verify/bin/python" -m pip install \
            -r scripts/pre-rentree/requirements.lock
          echo "$RUNNER_TEMP/pre-rentree-verify/bin" >> "$GITHUB_PATH"

      - name: Verify frozen public PDFs
        run: |
          npm run pre-rentree:public-pdfs:verify
          git diff --exit-code
          test -z "$(git status --short)"

  # ===========================================================================
  # JOB 10: STATUS CHECK (All jobs must pass)
  # ===========================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - dependency-integrity
      - lint
      - typecheck
      - unit
      - integration
      - real-db-integration
      - e2e
      - security
      - build
      - documents
    if: ${{ always() }}

    steps:
      - name: Check all jobs status
        run: |
          FAIL=0

          # Every required job must be represented and exactly 'success'.
          for result_pair in \
            "dependency-integrity:${{ needs.dependency-integrity.result }}" \
            "lint:${{ needs.lint.result }}" \
            "typecheck:${{ needs.typecheck.result }}" \
            "unit:${{ needs.unit.result }}" \
            "integration:${{ needs.integration.result }}" \
            "real-db-integration:${{ needs.real-db-integration.result }}" \
            "e2e:${{ needs.e2e.result }}" \
            "security:${{ needs.security.result }}" \
            "build:${{ needs.build.result }}" \
            "documents:${{ needs.documents.result }}"; do
            job="${result_pair%%:*}"
            result="${result_pair#*:}"
            if [ "$result" != "success" ]; then
              echo "FAIL $job: $result"
              FAIL=1
            else
              echo "OK $job: $result"
            fi
          done

          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "CI Pipeline Failed"
            exit 1
          fi
          echo ""
          echo "All CI checks passed"
