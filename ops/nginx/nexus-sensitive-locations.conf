# Include inside the Nexus TLS server{} block. The access log is already
# redacted by nexus-safe-log.conf; these exact prefix locations also prevent
# Nginx's built-in error logger from copying bearer-bearing request lines.

location ^~ /bilan/consultation/ {
    error_log /dev/null crit;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 86400;
}

