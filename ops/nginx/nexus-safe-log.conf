# Install in the nginx http{} context (for example /etc/nginx/conf.d/).
# The Nexus vhost must select this format with:
#   access_log /var/log/nginx/access.log nexus_safe;

map $uri $nexus_safe_uri {
    ~^/bilan/consultation/[^/]+ /bilan/consultation/[REDACTED];
    ~^/api/bilan/consultation/[^/]+ /api/bilan/consultation/[REDACTED];
    ~^/devis/[^/]+ /devis/[REDACTED];
    ~^/api/quotes/public/[^/]+ /api/quotes/public/[REDACTED];
    default $uri;
}

map $http_referer $nexus_safe_referer {
    ~^https?://[^/]+/(?:api/)?bilan/consultation/ [REDACTED];
    ~^https?://[^/]+/(?:devis|api/quotes/public)/ [REDACTED];
    default [PRESENT];
}

log_format nexus_safe '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $nexus_safe_uri $server_protocol" '
                      '$status $body_bytes_sent "$nexus_safe_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';
